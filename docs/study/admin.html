<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/naite-library/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/naite-library/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/naite-library/apple-touch-icon.png">
<link rel="manifest" href="/naite-library/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="나이테">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#245648">
<title>스터디 관리자 — 나이테 엄마표영어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#E4E7DD;color:#23291F;font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;line-height:1.55}
:root{--surface:#FCFCF8;--line:#E2E5DA;--soft:#565E4E;--teal:#2F6E58;--tealD:#245648;--coral:#B87343;--sh:0 1px 2px rgba(43,42,38,.06),0 6px 18px rgba(43,42,38,.07)}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:'Gowun Batang',Georgia,serif;margin:0;line-height:1.2}
a{color:var(--tealD)}
.top{position:sticky;top:0;z-index:20;background:rgba(228,231,221,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:11px 18px}
.brand{font-weight:700;font-family:'Gowun Batang',Georgia,serif}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}.tabs::-webkit-scrollbar{display:none}
.bar1{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.bar1 .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.tab{white-space:nowrap}
@media (max-width:700px){.tab{padding:7px 9px;font-size:.8rem}}
a.btn{text-decoration:none;display:inline-block}
.menu{position:relative}.menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;min-width:190px;display:none;z-index:30}
.menu.open .dd{display:block}.dd a,.dd button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-size:.86rem;color:#23291F;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none}
.dd a:hover,.dd button:hover{background:#F1F3EB}
.cur{font-size:1.4rem;font-weight:800;letter-spacing:.15em;font-variant-numeric:tabular-nums}
.tab{border:1px solid var(--line);background:var(--surface);font:inherit;font-size:.85rem;font-weight:700;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--soft)}
.tab.on{background:var(--tealD);color:#fff;border-color:var(--tealD)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;font-weight:700;padding:8px 13px;border-radius:9px;cursor:pointer}
.btn.cor{background:var(--coral);color:#fff;border-color:var(--coral)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin:16px 0}
label.f{display:block;font-size:.82rem;font-weight:800;color:var(--soft);margin:14px 0 5px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.95rem;padding:10px 12px;border-radius:10px}
textarea.t{min-height:90px;resize:vertical;line-height:1.5}
.hint{font-size:.76rem;color:var(--soft);margin-top:4px}
.bk{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.bk img{width:52px;height:70px;object-fit:cover;border-radius:6px;background:#eee;flex:0 0 auto}
.bk .bf{flex:1;min-width:0}.pill{font-size:.72rem;font-weight:800;color:var(--tealD)}
.status{font-size:.85rem;font-weight:700}
.login{max-width:420px;margin:70px auto;text-align:center}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .n{font-family:'Gowun Batang',Georgia,serif;font-weight:700;font-size:1.7rem;color:var(--tealD)}
.kpi .l{font-size:.8rem;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--soft);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.hidden{display:none}
.warn{background:#fff3cd;border:1px solid #e0c97a;border-radius:10px;padding:12px 14px;color:#6b5900;font-size:.88rem}
.pvmask{position:fixed;inset:0;z-index:100;background:rgba(35,41,31,.6);display:flex;flex-direction:column;align-items:center;padding:16px 12px}
.pvbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.pvbar .t{color:#fff;font-weight:700;font-family:'Gowun Batang',serif}
.pvbar .seg{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:9px;overflow:hidden}
.pvbar .seg button{background:transparent;color:#fff;border:none;font:inherit;font-size:.82rem;font-weight:700;padding:6px 12px;cursor:pointer}
.pvbar .seg button.on{background:#fff;color:var(--tealD)}
.pvframe{width:100%;max-width:430px;flex:1;min-height:0;background:#E4E7DD;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);transition:max-width .18s}
.pvframe iframe{width:100%;height:100%;border:0;display:block;background:#E4E7DD}
#pdfout{display:none}
@media print{
  .top,#root{display:none!important}
  #pdfout{display:block!important;color:#000;font-family:'Noto Sans KR',sans-serif}
  body{background:#fff}
  @page{size:A4;margin:12mm}
  .pdf-h1{font-size:20pt;font-family:'Gowun Batang',serif;margin:0 0 2pt}
  .pdf-sub{font-size:10pt;color:#555;margin:0 0 2pt}
  .pdf-subject{font-size:9.5pt;color:#333;margin:6pt 0 10pt;white-space:pre-wrap;line-height:1.55}
  .pdf-sec-h{font-size:12pt;font-weight:800;border-bottom:1.5pt solid #245648;color:#245648;padding-bottom:2pt;margin:13pt 0 6pt}
  .pb-book{display:flex;gap:10pt;break-inside:avoid;border-bottom:.5pt solid #ccc;padding:8pt 0}
  .pb-cov{width:58pt;height:78pt;flex:0 0 58pt;border:.5pt solid #ddd;object-fit:cover}
  .pb-info{flex:1;min-width:0}
  .pb-ty{font-size:8pt;font-weight:800;color:#fff;background:#2f6e58;display:inline-block;padding:1pt 5pt;border-radius:3pt}
  .pb-t{font-size:11pt;font-weight:800;margin:3pt 0 1pt}
  .pb-a{font-size:9pt;color:#555}
  .pb-badges{font-size:8pt;color:#333;margin:3pt 0}.pb-badges span{margin-right:7pt;white-space:nowrap}
  .pb-r{font-size:9pt;color:#333;margin-top:2pt;line-height:1.4}
  .pb-qrs{display:flex;gap:8pt;flex:0 0 auto;align-items:flex-start}
  .pb-qr{text-align:center;font-size:7.5pt;color:#333;width:66pt}
  .pb-qr img{width:60pt;height:60pt;display:block;margin:0 auto 2pt}
  .pdf-prose{font-size:9.5pt;white-space:pre-wrap;line-height:1.6}
  .pdf-list{margin:0;padding-left:15pt;font-size:9.5pt;line-height:1.55}
  .pdf-expr{list-style:none;padding:0;margin:0;font-size:9.5pt}.pdf-expr li{margin:3pt 0}.pdf-expr .k{color:#555}
  .pdf-foot{margin-top:12pt;border-top:.5pt solid #ccc;padding-top:6pt;font-size:8pt;color:#666;text-align:center}
}
</style>
</head>
<body>
<div id="root"><div class="wrap"><p style="padding:60px 0;text-align:center;color:var(--soft)">불러오는 중…</p></div></div>
<div id="pdfout"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var root=document.getElementById('root');
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if(!window.SUPA_ANON||window.SUPA_ANON.indexOf('PASTE')===0){
    root.innerHTML='<div class="wrap"><div class="warn" style="margin-top:40px">⚙️ 먼저 <code>config.js</code> 에 Supabase anon key 를 넣고 DB(schema.sql·seed.sql)를 실행하세요.</div></div>';return;
  }
  var client=supabase.createClient(window.SUPA_URL, window.SUPA_ANON);
  var _hv=(location.hash||'').slice(1);
  var STATE={view:(['content','buyurls','guides','members'].indexOf(_hv)>=0?_hv:'content'),tab:'content', themes:[], booksByTheme:{}, contentByTheme:{}, current:null, editKey:null, user:null};
  // 난이도 단계: 🌱 조작북·AR<2.0 / 🌿 AR 2~3 / 🌳 AR 3 이상
  var LV_EASY_MAX=2.0, LV_MID_MAX=3.0;
  var LV_LABEL={1:'🌱 글밥 적음',2:'🌿 글밥 보통',3:'🌳 글밥 많음'};
  function level(b){if(b.tier===1)return 1;if(b.ar==null||b.ar==='')return 0;var a=Number(b.ar);return a<LV_EASY_MAX?1:(a<LV_MID_MAX?2:3);}

  // ---------- AUTH ----------
  function renderLogin(){
    root.innerHTML='<div class="wrap"><div class="login card">'+
      '<h1>스터디 관리자</h1>'+
      '<p class="hint" style="margin:10px 0 16px">관리자 이메일과 비밀번호로 로그인하세요.</p>'+
      '<input class="t" id="email" type="email" placeholder="관리자 이메일" autocomplete="off" style="margin-bottom:9px">'+
      '<input class="t" id="pw" type="password" placeholder="비밀번호" autocomplete="off">'+
      '<button class="btn cor" id="signin" style="margin-top:12px;width:100%">로그인</button>'+
      '<div class="status" id="lst" style="margin-top:10px"></div>'+
      '</div></div>';
    var email=document.getElementById('email'), pw=document.getElementById('pw'), st=document.getElementById('lst');
    email.focus();
    async function doLogin(){
      var e=(email.value||'').trim(), p=pw.value||'';
      if(!e||!p){st.textContent='이메일과 비밀번호를 입력하세요.';return;}
      st.textContent='로그인 중…';
      var r=await client.auth.signInWithPassword({email:e,password:p});
      if(r.error){st.textContent='로그인 실패: '+r.error.message;}
    }
    document.getElementById('signin').addEventListener('click',doLogin);
    pw.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin();});
  }

  async function boot(){
    var g=await client.auth.getSession();
    STATE.user=g.data.session?g.data.session.user:null;
    if(!STATE.user){renderLogin(null);return;}
    if(window.ADMIN_EMAIL && STATE.user.email && window.ADMIN_EMAIL.toLowerCase()!==STATE.user.email.toLowerCase()){
      root.innerHTML='<div class="wrap"><div class="warn" style="margin-top:40px">이 계정(<b>'+esc(STATE.user.email)+'</b>)은 관리자가 아니에요. 관리자 이메일로 로그인하세요. <button class="btn" id="lo">로그아웃</button></div></div>';
      document.getElementById('lo').addEventListener('click',async function(){await client.auth.signOut();boot();});return;
    }
    await loadAll();
    renderApp();
  }
  client.auth.onAuthStateChange(function(_e,sess){var u=sess?sess.user:null;if((u&&!STATE.user)||(!u&&STATE.user)){STATE.user=u;boot();}});

  // ---------- DATA ----------
  async function loadAll(){
    var th=await client.from('themes').select('*').order('sort');
    STATE.themes=th.data||[];
    var bk=await client.from('books').select('*').order('sort');
    STATE.booksByTheme={};(bk.data||[]).forEach(function(b){(STATE.booksByTheme[b.theme_key]=STATE.booksByTheme[b.theme_key]||[]).push(b);});
    var ct=await client.from('content').select('*');
    STATE.contentByTheme={};(ct.data||[]).forEach(function(c){STATE.contentByTheme[c.theme_key]=c;});
    var gd=await client.from('guides').select('*').order('sort').order('id');
    STATE.guides=(gd&&gd.data)||[];STATE.guidesErr=gd&&gd.error;
    var st=await client.from('settings').select('*').eq('id',1).maybeSingle();
    STATE.current=st.data?st.data.current_theme:(STATE.themes[0]&&STATE.themes[0].key);
    STATE.chatMembers=(st.data&&'chat_members' in st.data)?(st.data.chat_members||0):null; // null = 컬럼 없음(migrate_chat_members.sql 전)
    STATE.editKey=STATE.editKey||STATE.current||(STATE.themes[0]&&STATE.themes[0].key);
  }

  // ---------- SHELL ----------
  function renderApp(){
    var v=STATE.view||'content';
    var TABS=[['content','📝 스터디 내용'],['buyurls','🛒 쿠팡 링크'],['guides','📚 가이드'],['members','🔑 회원 비밀번호']];
    var h='<div class="top"><div class="wrap" style="display:block;padding:0 18px">'+
      '<div class="bar1"><span class="brand">🛠️ 나이테 관리</span><span class="sp"><a class="btn" href="kpi.html">📊 KPI</a>'+
        '<span class="menu" id="menu"><button class="btn" id="mbtn" aria-label="더보기">⋯</button><div class="dd">'+
          '<a href="index.html" target="_blank">📘 스터디 자료 공유 페이지 ↗</a><a href="../" target="_blank">🌱 나이테 열기 ↗</a><a href="../record/" target="_blank">📖 나이테 기록 열기 ↗</a>'+
          '<button id="logout">로그아웃</button></div></span></span></div>'+
      '<div class="tabs">'+TABS.map(function(t){return '<button class="tab'+(v===t[0]?' on':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>'+
      '</div></div><div class="wrap" id="body"></div>';
    root.innerHTML=h;
    root.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){STATE.view=b.dataset.v;try{history.replaceState(null,'','#'+STATE.view);}catch(e){}renderApp();});});
    var menu=document.getElementById('menu');
    document.getElementById('mbtn').addEventListener('click',function(ev){ev.stopPropagation();menu.classList.toggle('open');});
    document.addEventListener('click',function(){menu.classList.remove('open');});
    document.getElementById('logout').addEventListener('click',async function(){await client.auth.signOut();STATE.user=null;renderLogin(null);});
    if(v==='buyurls')renderBuyUrls(); else if(v==='guides')renderGuides(); else if(v==='members')renderMembers(); else renderContent();
  }

  // ---------- 가이드 화면(엄마표영어 읽을거리) ----------
  function renderGuides(){
    var body=document.getElementById('body');
    if(STATE.guidesErr){body.innerHTML='<div class="card"><div class="warn">가이드 DB가 아직 없어요. Supabase SQL Editor에서 <b>supabase/migrate_guides.sql</b>을 먼저 실행해 주세요.<br><small>'+esc(STATE.guidesErr.message||'')+'</small></div></div>';return;}
    var rows=(STATE.guides||[]).map(function(g){
      return '<div class="grow" data-gid="'+g.id+'" style="display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap">'+
        '<input class="t gt" style="flex:1 1 34%;min-width:130px;font-size:.85rem;padding:7px 9px" value="'+esc(g.title)+'" placeholder="제목">'+
        '<input class="t gu" style="flex:1 1 44%;min-width:150px;font-size:.78rem;padding:7px 9px" value="'+esc(g.url)+'" placeholder="https://블로그 글 URL">'+
        '<input class="t gs" style="flex:0 0 54px;font-size:.78rem;padding:7px 4px;text-align:center" value="'+(g.sort||0)+'" title="정렬(작을수록 위)">'+
        '<button class="btn gdel" style="flex:0 0 auto;padding:7px 10px" title="삭제">🗑</button></div>';
    }).join('');
    body.innerHTML='<div class="card"><label class="f" style="margin-top:0">📚 엄마표영어 가이드 <span class="hint">(메인·가이드 페이지에 노출)</span></label>'+
      '<div class="hint" style="margin-bottom:10px">제목과 <b>블로그 글 URL</b>을 넣으세요. 정렬값이 작을수록 위에 보여요. 저장하면 공개 가이드 페이지에 바로 반영됩니다.</div>'+
      '<div id="grows">'+(rows||'<div class="hint">아직 가이드가 없어요. 아래에서 추가하세요.</div>')+'</div>'+
      '<div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="btn" id="gadd">+ 새 가이드 추가</button><button class="btn cor" id="gsave">저장</button><span class="status" id="gst"></span></div></div>';
    document.getElementById('gadd').addEventListener('click',addGuide);
    document.getElementById('gsave').addEventListener('click',saveGuides);
    body.querySelectorAll('.gdel').forEach(function(b){b.addEventListener('click',function(){var row=b.closest('.grow');deleteGuide(+row.dataset.gid,row);});});
  }
  async function addGuide(){
    var st=document.getElementById('gst');st.textContent='추가 중…';
    var mx=(STATE.guides||[]).reduce(function(m,g){return Math.max(m,g.sort||0);},0);
    var r=await client.from('guides').insert({title:'새 가이드',url:'',sort:mx+1}).select();
    if(r.error){st.textContent='실패: '+r.error.message;return;}
    STATE.guides.push(r.data[0]);renderGuides();
  }
  async function deleteGuide(id,row){
    if(!confirm('이 가이드를 삭제할까요?'))return;
    var r=await client.from('guides').delete().eq('id',id);
    if(r.error){alert('삭제 실패: '+r.error.message);return;}
    STATE.guides=(STATE.guides||[]).filter(function(g){return g.id!==id;});if(row)row.remove();
  }
  async function saveGuides(){
    var st=document.getElementById('gst');st.textContent='저장 중…';
    var rows=document.querySelectorAll('#grows .grow'),errs=0,n=0;
    for(var i=0;i<rows.length;i++){var el=rows[i],id=+el.dataset.gid,
        title=el.querySelector('.gt').value.trim(),url=el.querySelector('.gu').value.trim(),sort=parseInt(el.querySelector('.gs').value,10)||0;
      var cur=(STATE.guides||[]).filter(function(g){return g.id===id;})[0];
      if(cur&&(cur.title!==title||cur.url!==url||(cur.sort||0)!==sort)){
        var r=await client.from('guides').update({title:title,url:url,sort:sort}).eq('id',id);
        if(r.error)errs++;else{cur.title=title;cur.url=url;cur.sort=sort;n++;}}}
    st.textContent=errs?('저장 '+n+'건, 실패 '+errs+'건'):(n?('✓ 저장 '+n+'건'):'변경 없음');
  }

  // ---------- 쿠팡 링크 화면(전체 120권) ----------
  function renderBuyUrls(){
    var body=document.getElementById('body');
    var html='<div class="card"><label class="f" style="margin-top:0">🛒 책별 쿠팡 링크 <span class="hint">(나이테 120에서 제목 클릭 시 열림)</span></label>'+
      '<div class="hint" style="margin-bottom:10px">파트너스 단축링크(https://link.coupang.com/a/…)를 넣으세요. 넣은 책만 제목이 클릭돼요. 스터디 5권에 넣은 링크도 여기 함께 보여요. 저장하면 나이테 120에 바로 반영됩니다.</div>';
    (STATE.themes||[]).forEach(function(t){
      var books=STATE.booksByTheme[t.key]||[];
      html+='<div style="margin-top:14px"><div style="font-weight:800;color:var(--tealD);font-size:.9rem;margin-bottom:4px">'+esc(t.emoji+' '+t.ko)+'</div>';
      books.forEach(function(b){
        html+='<div style="display:flex;gap:8px;align-items:center;margin:5px 0">'+
          '<div style="flex:0 0 40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem" title="'+esc(b.title)+'">'+esc(b.title)+'</div>'+
          '<input class="t buyurl" data-bid="'+b.id+'" style="flex:1;font-size:.78rem;padding:7px 9px" placeholder="https://link.coupang.com/a/..." value="'+esc(b.buy_url||'')+'"></div>';
      });
      html+='</div>';
    });
    html+='<div id="shopSec" style="margin-top:22px;border-top:1px dashed var(--line);padding-top:14px"><div style="font-weight:800;color:var(--tealD);font-size:.9rem">🇰🇷 국내 인기 책장 <span class="hint">(나이테 120에 없는 책 · 구매 참고 페이지에 표시)</span></div><p class="hint">불러오는 중…</p></div>';

  // ---------- PDF(인쇄) 생성 ----------
  function qr(text){
    try{ var q=qrcode(0,'M'); q.addData(String(text)); q.make(); return q.createDataURL(4,2); }catch(e){ return ''; }
  }
  function parseListP(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean);}
  function parseMisP(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var i=l.indexOf('|');return i<0?{title:l,body:''}:{title:l.slice(0,i).trim(),body:l.slice(i+1).trim()};});}
  function parseExprP(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var m=l.split(/\s*[|\-–]\s*/);return {en:m[0]||'',ko:m.slice(1).join(' - ')};});}
  async function buildPdf(key){
    var st=document.getElementById('saveSt'); st.textContent='PDF 준비 중…';
    var theme=STATE.themes.filter(function(t){return t.key===key;})[0];
    var c=STATE.contentByTheme[key]||{};
    var books=(STATE.booksByTheme[key]||[]).slice();
    var TORD={1:1,3:2,2:3,4:4,5:5};
    books.sort(function(a,b){var la=level(a)||99,lb=level(b)||99;if(la!==lb)return la-lb;return (TORD[a.tier]||9)-(TORD[b.tier]||9);});
    if(!theme){st.textContent='주제를 찾지 못했어요.';return;}
    var bh='';
    for(var i=0;i<books.length;i++){
      var b=books[i], badges=[], _lv=level(b);
      if(_lv) badges.push(LV_LABEL[_lv]);
      if(b.format) badges.push('형태: '+esc(b.format));
      if(b.award) badges.push(esc(b.award));
      if(b.kr_popular) badges.push('🇰🇷 국내 인기');
      if(b.pop_rank) badges.push('🌍 세계 인기');
      if(b.lib_loans) badges.push('📚 도서관 '+b.lib_loans+'회');
      var qrs='';
      if(b.read_aloud){var u=await qr(b.read_aloud); if(u) qrs+='<div class="pb-qr"><img src="'+u+'">📺 영상</div>';}
      if(b.workbook){var u2=await qr(b.workbook); if(u2) qrs+='<div class="pb-qr"><img src="'+u2+'">📄 워크지</div>';}
      if(b.buy_url){var u3=await qr(b.buy_url); if(u3) qrs+='<div class="pb-qr"><img src="'+u3+'">📖 책정보</div>';}
      bh+='<div class="pb-book">'+
        (b.cover?'<img class="pb-cov" src="'+esc(b.cover)+'">':'<div class="pb-cov"></div>')+
        '<div class="pb-info"><span class="pb-ty">'+esc(b.tier_label)+'</span>'+
        '<div class="pb-t">'+esc(b.title)+'</div><div class="pb-a">'+esc(b.author)+'</div>'+
        (badges.length?'<div class="pb-badges">'+badges.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>':'')+
        (b.reason?'<div class="pb-r">'+esc(b.reason)+'</div>':'')+'</div>'+
        (qrs?'<div class="pb-qrs">'+qrs+'</div>':'')+'</div>';
    }
    var acts=parseListP(c.activities), exprs=parseExprP(c.expressions);
    var h='<div class="pdf-h1">'+esc(theme.emoji)+' '+esc(theme.ko)+' <span style="font-size:11pt;color:#888">'+esc(theme.en)+'</span></div>'+
      '<div class="pdf-sub">'+(c.month_label?esc(c.month_label)+' · ':'')+'나이테 엄마표영어 스터디</div>'+
      (c.subject?'<div class="pdf-subject">'+esc(c.subject)+'</div>':'');
    h+='<div class="pdf-sec-h">📚 이번 달 5권</div>'+bh;
    h+='<div class="pdf-sec-h">🗣️ 읽어주는 방법</div>'+(c.read_method?'<div class="pdf-prose">'+esc(c.read_method)+'</div>':'<div class="pdf-prose">—</div>');
    h+='<div class="pdf-sec-h">🎨 책 활용 아이디어</div>'+(acts.length?'<ul class="pdf-list">'+acts.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':'<div class="pdf-prose">—</div>');
    h+='<div class="pdf-sec-h">💬 관련 영어표현</div>'+(exprs.length?'<ul class="pdf-expr">'+exprs.map(function(e){return '<li><b>'+esc(e.en)+'</b>'+(e.ko?' <span class="k">'+esc(e.ko)+'</span>':'')+'</li>';}).join('')+'</ul>':'<div class="pdf-prose">—</div>');
    var mis=parseMisP(c.missions);
    if(mis.length)h+='<div class="pdf-sec-h">🎯 이번 달 미션</div>'+'<ol class="pdf-list">'+mis.map(function(m){return '<li><b>'+esc(m.title)+'</b>'+(m.body?' — '+esc(m.body):'')+'</li>';}).join('')+'</ol>';
    var ext=parseMisP(c.extras); // 재사용: "제목 | URL"
    if(ext.length){
      var exq='';
      for(var e2=0;e2<ext.length;e2++){var x=ext[e2],url=x.body||x.title,label=x.body?x.title:'';var uq=await qr(url);
        exq+='<div class="pb-qr">'+(uq?'<img src="'+uq+'">':'')+(label?esc(label):'🔗 링크')+'</div>';}
      h+='<div class="pdf-sec-h">📎 부가자료</div><div class="pb-qrs">'+exq+'</div>';
    }
    h+='<div class="pdf-foot">나이테 영어도서관 · QR을 스캔하면 영상·워크지·책정보 링크로 연결돼요 · © 나이테 영어도서관</div>';
    document.getElementById('pdfout').innerHTML=h;
    st.textContent='✓ 인쇄 창을 여는 중…';
    setTimeout(function(){window.print();st.textContent='';},300);
  }

    var inputs=document.querySelectorAll('#form input[data-bid]'), byId={};
    inputs.forEach(function(inp){var id=inp.dataset.bid;(byId[id]=byId[id]||{id:+id})[inp.dataset.fld]=inp.value;});
    var errs=0;
    for(var id in byId){var u=byId[id];var r=await client.from('books').update({title:u.title,author:u.author,reason:u.reason,read_aloud:u.read_aloud,workbook:u.workbook,buy_url:u.buy_url}).eq('id',u.id);if(r.error)errs++;}
    STATE.contentByTheme[key]=content;
    (STATE.booksByTheme[key]||[]).forEach(function(b){var u=byId[b.id];if(u){b.title=u.title;b.author=u.author;b.reason=u.reason;b.read_aloud=u.read_aloud;b.workbook=u.workbook;b.buy_url=u.buy_url;}});
    st.textContent=errs?('내용 저장됨, 책 '+errs+'건 실패'):'✓ 저장 완료';
  }
  function val(id){var e=document.getElementById(id);return e?e.value:'';}

  // ---------- 회원 비밀번호 (나이테 기록 입장용) ----------
  async function renderMembers(){
    var body=document.getElementById('body');
    body.innerHTML='<div class="card"><p class="status">불러오는 중…</p></div>';
    var cfg=await client.from('member_config').select('member_code,updated_at').eq('id',1).maybeSingle();
    if(cfg.error){body.innerHTML='<div class="card"><div class="warn">회원 기록용 DB가 아직 없어요. Supabase SQL Editor에서 <b>supabase/migrate_reading_logs.sql</b>을 먼저 실행해 주세요.<br><small>'+esc(cfg.error.message)+'</small></div></div>';return;}
    var code=(cfg.data&&cfg.data.member_code)||'';
    body.innerHTML='<div class="card" style="max-width:520px"><h3>🔑 회원 비밀번호</h3>'+
      '<p class="hint">나이테 기록 앱(<a href="../record/" target="_blank">record/</a>)에 들어갈 때 쓰는 회원 비밀번호예요.</p>'+
      '<div class="hint" style="margin-top:12px">지금 비밀번호</div><div class="cur">'+(code?esc(code):'<span style="color:#a2231d;letter-spacing:0;font-size:1rem">설정 안 됨 (아무도 기록할 수 없어요)</span>')+'</div>'+
      '<label class="f" for="nc">새 비밀번호</label><input class="t" id="nc" inputmode="numeric" maxlength="20" placeholder="예: 1102" autocomplete="off">'+
      '<button class="btn cor" id="msave" style="margin-top:10px">저장</button> <span class="status" id="mst"></span>'+
      '<p class="hint" style="margin-top:12px">바꾸면 회원들은 다음 접속 때 새 비밀번호를 한 번 넣어야 해요. 읽기 기록은 비밀번호와 따로 저장돼서 그대로 이어져요. 읽기 통계는 📊 KPI › 📖 나이테 기록 / 📚 이번 달 책에서 봐요.</p></div>';
    document.getElementById('msave').addEventListener('click',async function(){
      var v=document.getElementById('nc').value.trim(),st=document.getElementById('mst');
      if(!v){st.textContent='새 비밀번호를 넣어주세요.';return;}
      var r=await client.from('member_config').update({member_code:v,updated_at:new Date().toISOString()}).eq('id',1).select();
      if(r.error||!r.data||!r.data.length){st.textContent='저장하지 못했어요'+(r.error?': '+r.error.message:' (관리자 계정인지 확인해 주세요)');return;}
      st.textContent='✓ 저장했어요';setTimeout(renderMembers,700);
    });
  }

  boot();
})();
</script>
</body>
</html>
