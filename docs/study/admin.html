<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스터디 관리자 — 나이테 엄마표영어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#E4E7DD;color:#23291F;font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;line-height:1.55}
:root{--surface:#FCFCF8;--line:#E2E5DA;--soft:#565E4E;--teal:#2F6E58;--tealD:#245648;--coral:#B87343;--sh:0 1px 2px rgba(43,42,38,.06),0 6px 18px rgba(43,42,38,.07)}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:'Gowun Batang',Georgia,serif;margin:0;line-height:1.2}
a{color:var(--tealD)}
.top{position:sticky;top:0;z-index:20;background:rgba(228,231,221,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:11px 18px}
.brand{font-weight:700;font-family:'Gowun Batang',Georgia,serif}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);font:inherit;font-size:.85rem;font-weight:700;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--soft)}
.tab.on{background:var(--tealD);color:#fff;border-color:var(--tealD)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;font-weight:700;padding:8px 13px;border-radius:9px;cursor:pointer}
.btn.cor{background:var(--coral);color:#fff;border-color:var(--coral)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin:16px 0}
label.f{display:block;font-size:.82rem;font-weight:800;color:var(--soft);margin:14px 0 5px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.95rem;padding:10px 12px;border-radius:10px}
textarea.t{min-height:90px;resize:vertical;line-height:1.5}
.hint{font-size:.76rem;color:var(--soft);margin-top:4px}
.bk{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.bk img{width:52px;height:70px;object-fit:cover;border-radius:6px;background:#eee;flex:0 0 auto}
.bk .bf{flex:1;min-width:0}.pill{font-size:.72rem;font-weight:800;color:var(--tealD)}
.status{font-size:.85rem;font-weight:700}
.login{max-width:420px;margin:70px auto;text-align:center}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .n{font-family:'Gowun Batang',Georgia,serif;font-weight:700;font-size:1.7rem;color:var(--tealD)}
.kpi .l{font-size:.8rem;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--soft);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.hidden{display:none}
.warn{background:#fff3cd;border:1px solid #e0c97a;border-radius:10px;padding:12px 14px;color:#6b5900;font-size:.88rem}
#pdfout{display:none}
@media print{
  .top,#root{display:none!important}
  #pdfout{display:block!important;color:#000;font-family:'Noto Sans KR',sans-serif}
  body{background:#fff}
  @page{size:A4;margin:12mm}
  .pdf-h1{font-size:20pt;font-family:'Gowun Batang',serif;margin:0 0 2pt}
  .pdf-sub{font-size:10pt;color:#555;margin:0 0 2pt}
  .pdf-subject{font-size:9.5pt;color:#333;margin:6pt 0 10pt;white-space:pre-wrap;line-height:1.55}
  .pdf-sec-h{font-size:12pt;font-weight:800;border-bottom:1.5pt solid #245648;color:#245648;padding-bottom:2pt;margin:13pt 0 6pt}
  .pb-book{display:flex;gap:10pt;break-inside:avoid;border-bottom:.5pt solid #ccc;padding:8pt 0}
  .pb-cov{width:58pt;height:78pt;flex:0 0 58pt;border:.5pt solid #ddd;object-fit:cover}
  .pb-info{flex:1;min-width:0}
  .pb-ty{font-size:8pt;font-weight:800;color:#fff;background:#2f6e58;display:inline-block;padding:1pt 5pt;border-radius:3pt}
  .pb-t{font-size:11pt;font-weight:800;margin:3pt 0 1pt}
  .pb-a{font-size:9pt;color:#555}
  .pb-badges{font-size:8pt;color:#333;margin:3pt 0}.pb-badges span{margin-right:7pt;white-space:nowrap}
  .pb-r{font-size:9pt;color:#333;margin-top:2pt;line-height:1.4}
  .pb-qrs{display:flex;gap:8pt;flex:0 0 auto;align-items:flex-start}
  .pb-qr{text-align:center;font-size:7.5pt;color:#333;width:66pt}
  .pb-qr img{width:60pt;height:60pt;display:block;margin:0 auto 2pt}
  .pdf-prose{font-size:9.5pt;white-space:pre-wrap;line-height:1.6}
  .pdf-list{margin:0;padding-left:15pt;font-size:9.5pt;line-height:1.55}
  .pdf-expr{list-style:none;padding:0;margin:0;font-size:9.5pt}.pdf-expr li{margin:3pt 0}.pdf-expr .k{color:#555}
  .pdf-foot{margin-top:12pt;border-top:.5pt solid #ccc;padding-top:6pt;font-size:8pt;color:#666;text-align:center}
}
</style>
</head>
<body>
<div id="root"><div class="wrap"><p style="padding:60px 0;text-align:center;color:var(--soft)">불러오는 중…</p></div></div>
<div id="pdfout"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var root=document.getElementById('root');
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if(!window.SUPA_ANON||window.SUPA_ANON.indexOf('PASTE')===0){
    root.innerHTML='<div class="wrap"><div class="warn" style="margin-top:40px">⚙️ 먼저 <code>config.js</code> 에 Supabase anon key 를 넣고 DB(schema.sql·seed.sql)를 실행하세요.</div></div>';return;
  }
  var client=supabase.createClient(window.SUPA_URL, window.SUPA_ANON);
  var STATE={tab:'content', themes:[], booksByTheme:{}, contentByTheme:{}, current:null, editKey:null, user:null};

  // ---------- AUTH ----------
  function renderLogin(){
    root.innerHTML='<div class="wrap"><div class="login card">'+
      '<h1>스터디 관리자</h1>'+
      '<p class="hint" style="margin:10px 0 16px">관리자 이메일과 비밀번호로 로그인하세요.</p>'+
      '<input class="t" id="email" type="email" placeholder="관리자 이메일" autocomplete="off" style="margin-bottom:9px">'+
      '<input class="t" id="pw" type="password" placeholder="비밀번호" autocomplete="off">'+
      '<button class="btn cor" id="signin" style="margin-top:12px;width:100%">로그인</button>'+
      '<div class="status" id="lst" style="margin-top:10px"></div>'+
      '</div></div>';
    var email=document.getElementById('email'), pw=document.getElementById('pw'), st=document.getElementById('lst');
    email.focus();
    async function doLogin(){
      var e=(email.value||'').trim(), p=pw.value||'';
      if(!e||!p){st.textContent='이메일과 비밀번호를 입력하세요.';return;}
      st.textContent='로그인 중…';
      var r=await client.auth.signInWithPassword({email:e,password:p});
      if(r.error){st.textContent='로그인 실패: '+r.error.message;}
    }
    document.getElementById('signin').addEventListener('click',doLogin);
    pw.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin();});
  }

  async function boot(){
    var g=await client.auth.getSession();
    STATE.user=g.data.session?g.data.session.user:null;
    if(!STATE.user){renderLogin(null);return;}
    if(window.ADMIN_EMAIL && STATE.user.email && window.ADMIN_EMAIL.toLowerCase()!==STATE.user.email.toLowerCase()){
      root.innerHTML='<div class="wrap"><div class="warn" style="margin-top:40px">이 계정(<b>'+esc(STATE.user.email)+'</b>)은 관리자가 아니에요. 관리자 이메일로 로그인하세요. <button class="btn" id="lo">로그아웃</button></div></div>';
      document.getElementById('lo').addEventListener('click',async function(){await client.auth.signOut();boot();});return;
    }
    await loadAll();
    renderApp();
  }
  client.auth.onAuthStateChange(function(_e,sess){var u=sess?sess.user:null;if((u&&!STATE.user)||(!u&&STATE.user)){STATE.user=u;boot();}});

  // ---------- DATA ----------
  async function loadAll(){
    var th=await client.from('themes').select('*').order('sort');
    STATE.themes=th.data||[];
    var bk=await client.from('books').select('*').order('sort');
    STATE.booksByTheme={};(bk.data||[]).forEach(function(b){(STATE.booksByTheme[b.theme_key]=STATE.booksByTheme[b.theme_key]||[]).push(b);});
    var ct=await client.from('content').select('*');
    STATE.contentByTheme={};(ct.data||[]).forEach(function(c){STATE.contentByTheme[c.theme_key]=c;});
    var st=await client.from('settings').select('*').eq('id',1).maybeSingle();
    STATE.current=st.data?st.data.current_theme:(STATE.themes[0]&&STATE.themes[0].key);
    STATE.editKey=STATE.editKey||STATE.current||(STATE.themes[0]&&STATE.themes[0].key);
  }

  // ---------- SHELL ----------
  function renderApp(){
    var h='<div class="top"><div class="wrap"><span class="brand">🛠️ 스터디 관리자</span>'+
      '<span class="sp">'+
      '<a class="btn cor" href="stats.html">📊 KPI</a>'+
      '<a class="btn" href="index.html" target="_blank">공유 페이지 ↗</a>'+
      '<button class="btn" id="logout">로그아웃</button></span></div></div>'+
      '<div class="wrap" id="body"></div>';
    root.innerHTML=h;
    root.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){STATE.tab=t.dataset.tab;renderApp();});});
    document.getElementById('logout').addEventListener('click',async function(){await client.auth.signOut();STATE.user=null;renderLogin(null);});
    renderContent();
  }

  // ---------- CONTENT TAB ----------
  function renderContent(){
    var body=document.getElementById('body');
    var opt=function(sel){return STATE.themes.map(function(t){return '<option value="'+t.key+'"'+(t.key===sel?' selected':'')+'>'+esc(t.emoji+' '+t.ko+' ('+t.en+')')+'</option>';}).join('');};
    body.innerHTML=
      '<div class="card"><label class="f" style="margin-top:0">이번 달 공개 주제 <span class="hint">(부모가 링크 열면 보이는 주제)</span></label>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap"><select class="t" id="curSel" style="flex:1;min-width:220px">'+opt(STATE.current)+'</select>'+
        '<button class="btn cor" id="setCur">공개 설정</button></div><span class="status" id="curSt"></span></div>'+
      '<div class="card"><label class="f" style="margin-top:0">편집할 주제</label><select class="t" id="edSel">'+opt(STATE.editKey)+'</select>'+
        '<div id="form"></div>'+
        '<div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap"><button class="btn cor" id="save">저장</button><button class="btn" id="pdf">📄 PDF 만들기(인쇄)</button><span class="status" id="saveSt"></span></div>'+
        '<div class="hint">PDF에서는 영상·워크지·구매 링크가 <b>QR코드</b>로 들어가요. (편집 중인 주제 기준 · 인쇄 창에서 "PDF로 저장")</div></div>';
    document.getElementById('setCur').addEventListener('click',async function(){
      var k=document.getElementById('curSel').value;
      document.getElementById('curSt').textContent='설정 중…';
      var r=await client.from('settings').upsert({id:1,current_theme:k});
      if(!r.error){await client.from('content').upsert({theme_key:k,published:true});if(STATE.contentByTheme[k])STATE.contentByTheme[k].published=true;}
      document.getElementById('curSt').textContent=r.error?('실패: '+r.error.message):('✓ 현재 공개 주제: '+k+' (자동 발행됨)');
      if(!r.error)STATE.current=k;
    });
    document.getElementById('edSel').addEventListener('change',function(e){STATE.editKey=e.target.value;renderForm();});
    document.getElementById('save').addEventListener('click',saveContent);
    document.getElementById('pdf').addEventListener('click',function(){buildPdf(STATE.editKey);});
    renderForm();
  }

  // ---------- PDF(인쇄) 생성 ----------
  function qr(text){
    try{ var q=qrcode(0,'M'); q.addData(String(text)); q.make(); return q.createDataURL(4,2); }catch(e){ return ''; }
  }
  function parseListP(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean);}
  function parseExprP(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var m=l.split(/\s*[|\-–]\s*/);return {en:m[0]||'',ko:m.slice(1).join(' - ')};});}
  async function buildPdf(key){
    var st=document.getElementById('saveSt'); st.textContent='PDF 준비 중…';
    var theme=STATE.themes.filter(function(t){return t.key===key;})[0];
    var c=STATE.contentByTheme[key]||{};
    var books=(STATE.booksByTheme[key]||[]).slice();
    var TORD={1:1,3:2,2:3,4:4,5:5};
    books.sort(function(a,b){return (TORD[a.tier]||9)-(TORD[b.tier]||9);});
    if(!theme){st.textContent='주제를 찾지 못했어요.';return;}
    var bh='';
    for(var i=0;i<books.length;i++){
      var b=books[i], badges=[];
      if(b.format) badges.push('형태: '+esc(b.format));
      if(b.ar!=null&&b.ar!=='') badges.push('AR ~'+Number(b.ar).toFixed(1));
      if(b.award) badges.push(esc(b.award));
      if(b.kr_popular) badges.push('🇰🇷 국내 인기');
      if(b.pop_rank) badges.push('🌍 세계 인기');
      if(b.lib_loans) badges.push('📚 도서관 '+b.lib_loans+'회');
      var qrs='';
      if(b.read_aloud){var u=await qr(b.read_aloud); if(u) qrs+='<div class="pb-qr"><img src="'+u+'">📺 영상</div>';}
      if(b.workbook){var u2=await qr(b.workbook); if(u2) qrs+='<div class="pb-qr"><img src="'+u2+'">📄 워크지</div>';}
      if(b.buy_url){var u3=await qr(b.buy_url); if(u3) qrs+='<div class="pb-qr"><img src="'+u3+'">🛒 구매</div>';}
      bh+='<div class="pb-book">'+
        (b.cover?'<img class="pb-cov" src="'+esc(b.cover)+'">':'<div class="pb-cov"></div>')+
        '<div class="pb-info"><span class="pb-ty">'+esc(b.tier_label)+'</span>'+
        '<div class="pb-t">'+esc(b.title)+'</div><div class="pb-a">'+esc(b.author)+'</div>'+
        (badges.length?'<div class="pb-badges">'+badges.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>':'')+
        (b.reason?'<div class="pb-r">'+esc(b.reason)+'</div>':'')+'</div>'+
        (qrs?'<div class="pb-qrs">'+qrs+'</div>':'')+'</div>';
    }
    var acts=parseListP(c.activities), exprs=parseExprP(c.expressions);
    var h='<div class="pdf-h1">'+esc(theme.emoji)+' '+esc(theme.ko)+' <span style="font-size:11pt;color:#888">'+esc(theme.en)+'</span></div>'+
      '<div class="pdf-sub">'+(c.month_label?esc(c.month_label)+' · ':'')+'나이테 엄마표영어 스터디</div>'+
      (c.subject?'<div class="pdf-subject">'+esc(c.subject)+'</div>':'');
    h+='<div class="pdf-sec-h">📚 이번 달 5권</div>'+bh;
    h+='<div class="pdf-sec-h">🗣️ 읽어주는 방법</div>'+(c.read_method?'<div class="pdf-prose">'+esc(c.read_method)+'</div>':'<div class="pdf-prose">—</div>');
    h+='<div class="pdf-sec-h">🎨 책 활용 아이디어</div>'+(acts.length?'<ul class="pdf-list">'+acts.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul>':'<div class="pdf-prose">—</div>');
    h+='<div class="pdf-sec-h">💬 관련 영어표현</div>'+(exprs.length?'<ul class="pdf-expr">'+exprs.map(function(e){return '<li><b>'+esc(e.en)+'</b>'+(e.ko?' <span class="k">'+esc(e.ko)+'</span>':'')+'</li>';}).join('')+'</ul>':'<div class="pdf-prose">—</div>');
    h+='<div class="pdf-foot">나이테 영어도서관 · QR을 스캔하면 영상·워크지·구매 링크로 연결돼요 · © 나이테 영어도서관</div>';
    document.getElementById('pdfout').innerHTML=h;
    st.textContent='✓ 인쇄 창을 여는 중…';
    setTimeout(function(){window.print();st.textContent='';},300);
  }
  function renderForm(){
    var key=STATE.editKey, c=STATE.contentByTheme[key]||{}, books=STATE.booksByTheme[key]||[];
    var f=document.getElementById('form');
    var bh=books.map(function(b,i){
      return '<div class="bk">'+(b.cover?'<img src="'+esc(b.cover)+'">':'<div style="width:52px;height:70px;background:#eee;border-radius:6px"></div>')+
        '<div class="bf"><span class="pill">'+esc(b.tier_label)+'</span>'+
        '<input class="t" style="margin:4px 0" data-bid="'+b.id+'" data-fld="title" value="'+esc(b.title)+'">'+
        '<input class="t" style="margin-bottom:4px;font-size:.82rem" data-bid="'+b.id+'" data-fld="author" value="'+esc(b.author)+'">'+
        '<input class="t" style="margin-bottom:4px;font-size:.82rem" data-bid="'+b.id+'" data-fld="reason" value="'+esc(b.reason)+'">'+
        '<input class="t" style="margin-bottom:4px;font-size:.8rem" data-bid="'+b.id+'" data-fld="read_aloud" placeholder="📺 영상 링크 (유튜브 read aloud URL, 없으면 비워두기)" value="'+esc(b.read_aloud||'')+'">'+
        '<input class="t" style="margin-bottom:4px;font-size:.8rem" data-bid="'+b.id+'" data-fld="workbook" placeholder="📄 워크지 링크 (공식 무료 활동지 URL, 없으면 비워두기)" value="'+esc(b.workbook||'')+'">'+
        '<input class="t" style="font-size:.8rem" data-bid="'+b.id+'" data-fld="buy_url" placeholder="🛒 구매 링크 (쿠팡 파트너스 URL)" value="'+esc(b.buy_url||'')+'"></div></div>';
    }).join('');
    f.innerHTML=
      '<label class="f">월 라벨 <span class="hint">(예: 2026년 10월 · 1개월차)</span></label><input class="t" id="fml" value="'+esc(c.month_label)+'">'+
      '<label class="f">주제 소개 (엄마용)</label><textarea class="t" id="fsub" style="min-height:70px">'+esc(c.subject)+'</textarea>'+
      '<label class="f">읽어주는 방법</label><textarea class="t" id="frm">'+esc(c.read_method)+'</textarea>'+
      '<label class="f">책 활용 아이디어 <span class="hint">(한 줄에 하나)</span></label><textarea class="t" id="fact">'+esc(c.activities)+'</textarea>'+
      '<label class="f">관련 영어표현 <span class="hint">(한 줄에 하나 · "English - 한글")</span></label><textarea class="t" id="fexp">'+esc(c.expressions)+'</textarea>'+
      '<label class="f">🔒 이 페이지 비밀번호 <span class="hint">(비우면 누구나 열람 · 회원에게 배포할 비번을 넣으세요)</span></label><input class="t" id="fpass" value="'+esc(c.passcode||'')+'">'+
      '<label class="f" style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:12px"><input type="checkbox" id="fpub" '+(c.published?'checked':'')+' style="width:auto;margin:0"> 발행 <span class="hint" style="margin:0">(회원 열람 가능 · 지난 달 보관함에 표시)</span></label>'+
      '<label class="f">이번 주제 5권 <span class="hint">(제목·저자·한줄소개 + 📺영상/📄워크지/🛒구매 링크)</span></label>'+
      '<div class="hint" style="margin-bottom:6px">📺 영상은 유튜브 read aloud URL. 📄 워크지는 출판사·작가 <b>공식 무료 활동지 링크</b>만(파일 재배포 금지). 🛒 구매는 쿠팡 파트너스 링크. 빈 칸은 카드에 버튼이 안 보여요.</div>'+bh;
  }
  async function saveContent(){
    var key=STATE.editKey, st=document.getElementById('saveSt');
    st.textContent='저장 중…';
    var pubEl=document.getElementById('fpub');
    var content={theme_key:key,month_label:val('fml'),subject:val('fsub'),read_method:val('frm'),activities:val('fact'),expressions:val('fexp'),passcode:val('fpass'),published:!!(pubEl&&pubEl.checked),updated_at:new Date().toISOString()};
    var r1=await client.from('content').upsert(content);
    if(r1.error){st.textContent='실패: '+r1.error.message;return;}
    // 책 업데이트
    var inputs=document.querySelectorAll('#form input[data-bid]'), byId={};
    inputs.forEach(function(inp){var id=inp.dataset.bid;(byId[id]=byId[id]||{id:+id})[inp.dataset.fld]=inp.value;});
    var errs=0;
    for(var id in byId){var u=byId[id];var r=await client.from('books').update({title:u.title,author:u.author,reason:u.reason,read_aloud:u.read_aloud,workbook:u.workbook,buy_url:u.buy_url}).eq('id',u.id);if(r.error)errs++;}
    STATE.contentByTheme[key]=content;
    (STATE.booksByTheme[key]||[]).forEach(function(b){var u=byId[b.id];if(u){b.title=u.title;b.author=u.author;b.reason=u.reason;b.read_aloud=u.read_aloud;b.workbook=u.workbook;b.buy_url=u.buy_url;}});
    st.textContent=errs?('내용 저장됨, 책 '+errs+'건 실패'):'✓ 저장 완료';
  }
  function val(id){var e=document.getElementById(id);return e?e.value:'';}

  // ---------- KPI TAB ----------
  async function renderKPI(){
    var body=document.getElementById('body');
    body.innerHTML='<div class="card"><p class="status">KPI 불러오는 중…</p></div>';
    var r=await client.from('events').select('*').order('created_at',{ascending:false}).limit(5000);
    if(r.error){body.innerHTML='<div class="card"><div class="warn">KPI 조회 실패: '+esc(r.error.message)+'<br>(RLS의 admin read events 정책 + 관리자 이메일 확인)</div></div>';return;}
    var ev=r.data||[];
    var pv=ev.filter(function(e){return e.type==='page_view';});
    var sess={};pv.forEach(function(e){if(e.session_id)sess[e.session_id]=1;});
    var perTheme={};pv.forEach(function(e){var k=e.theme_key||'?';perTheme[k]=(perTheme[k]||0)+1;});
    var perPage={};pv.forEach(function(e){var p=(e.meta&&e.meta.page)||e.path||'?';perPage[p]=(perPage[p]||0)+1;});
    var clicks={};ev.filter(function(e){return e.type==='book_click';}).forEach(function(e){var t=(e.meta&&e.meta.title)||('#'+e.book_id);clicks[t]=(clicks[t]||0)+1;});
    var wbClicks={};ev.filter(function(e){return e.type==='workbook_click';}).forEach(function(e){var t=(e.meta&&e.meta.title)||'?';wbClicks[t]=(wbClicks[t]||0)+1;});
    var wbTotal=ev.filter(function(e){return e.type==='workbook_click';}).length;
    var buyClicks={};ev.filter(function(e){return e.type==='buy_click';}).forEach(function(e){var t=(e.meta&&e.meta.title)||'?';buyClicks[t]=(buyClicks[t]||0)+1;});
    var buyTotal=ev.filter(function(e){return e.type==='buy_click';}).length;
    var raClicks={};ev.filter(function(e){return e.type==='read_aloud_click';}).forEach(function(e){var t=(e.meta&&e.meta.title)||'?';raClicks[t]=(raClicks[t]||0)+1;});
    var raTotal=ev.filter(function(e){return e.type==='read_aloud_click';}).length;
    var dwell=ev.filter(function(e){return e.type==='dwell'&&e.meta&&e.meta.seconds;}).map(function(e){return e.meta.seconds;});
    var avgD=dwell.length?Math.round(dwell.reduce(function(a,b){return a+b;},0)/dwell.length):0;
    // ── 날짜별 집계(최근 14일) ──
    function dstr(x){var d=new Date(x);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
    var perDay={};
    ev.forEach(function(e){var k=dstr(e.created_at);var o=perDay[k]||(perDay[k]={view:0,sess:{},book:0,ra:0,wb:0,buy:0,pages:{}});
      if(e.type==='page_view'){o.view++;if(e.session_id)o.sess[e.session_id]=1;var pg=(e.meta&&e.meta.page)||e.path||'?';o.pages[pg]=(o.pages[pg]||0)+1;}
      else if(e.type==='book_click')o.book++;else if(e.type==='read_aloud_click')o.ra++;
      else if(e.type==='workbook_click')o.wb++;else if(e.type==='buy_click')o.buy++;});
    var days=[];var _t=new Date();for(var _i=13;_i>=0;_i--){var _d=new Date(_t);_d.setDate(_t.getDate()-_i);days.push(dstr(_d));}
    var METRICS={view:['방문','#2F6E58',function(o){return o?o.view:0;}],
      visitor:['순 방문자','#B87343',function(o){return o?Object.keys(o.sess).length:0;}],
      book:['책 클릭','#4F9A72',function(o){return o?o.book:0;}],
      ra:['영상 재생','#D1965C',function(o){return o?o.ra:0;}],
      wb:['워크지 열기','#245648',function(o){return o?o.wb:0;}],
      buy:['구매 클릭','#a2231d',function(o){return o?o.buy:0;}]};
    Object.keys(perPage).forEach(function(p){METRICS['p:'+p]=[p,'#4F9A72',function(o){return (o&&o.pages)?(o.pages[p]||0):0;}];});
    var baseOpts='<option value="view">방문(전체)</option><option value="visitor">순 방문자</option><option value="book">책 클릭</option><option value="ra">영상 재생</option><option value="wb">워크지 열기</option><option value="buy">구매 클릭</option>';
    var pageOpts=Object.keys(perPage).sort(function(a,b){return perPage[b]-perPage[a];}).map(function(p){return '<option value="p:'+esc(p)+'">📄 '+esc(p)+'</option>';}).join('');
    var optsHtml=baseOpts+(pageOpts?'<optgroup label="── 페이지별 방문 ──">'+pageOpts+'</optgroup>':'');
    function drawChart(mk){
      var m=METRICS[mk]||METRICS.view,col=m[1],f=m[2];
      var vals=days.map(function(dd){return f(perDay[dd]);});
      var max=Math.max.apply(null,vals.concat([1]));
      var W=700,H=210,padL=26,padB=34,padT=16,n=days.length,bw=(W-padL-10)/n,base=H-padB,plotH=H-padB-padT;
      var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;display:block">';
      s+='<line x1="'+padL+'" y1="'+base+'" x2="'+(W-4)+'" y2="'+base+'" stroke="#E2E5DA"/>';
      s+='<text x="2" y="'+(padT+4)+'" font-size="10" fill="#565E4E">'+max+'</text>';
      vals.forEach(function(v,i){var h=v>0?Math.max(2,Math.round(v/max*plotH)):0,x=padL+i*bw+3,y=base-h,w=bw-6;
        if(h>0)s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="'+col+'"><title>'+days[i]+' · '+v+'</title></rect>';
        if(v>0)s+='<text x="'+(x+w/2)+'" y="'+(y-3)+'" font-size="10" fill="#23291F" text-anchor="middle">'+v+'</text>';
        s+='<text x="'+(x+w/2)+'" y="'+(base+14)+'" font-size="9" fill="#565E4E" text-anchor="middle">'+days[i].slice(5).replace('-','/')+'</text>';});
      s+='</svg>';var el=document.getElementById('kchart');if(el)el.innerHTML=s;
    }
    function rows(obj){return Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+obj[k]+'</td></tr>';}).join('')||'<tr><td colspan=2 class="hint">데이터 없음</td></tr>';}
    var themeName={};STATE.themes.forEach(function(t){themeName[t.key]=t.emoji+' '+t.ko;});
    var perThemeNamed={};Object.keys(perTheme).forEach(function(k){perThemeNamed[themeName[k]||k]=perTheme[k];});
    var recent=ev.slice(0,20).map(function(e){return '<tr><td>'+esc(new Date(e.created_at).toLocaleString('ko-KR'))+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.theme_key||'')+'</td><td>'+esc((e.meta&&(e.meta.title||e.meta.seconds))||'')+'</td></tr>';}).join('');
    body.innerHTML=
      '<div class="card"><div class="kgrid">'+
        kpi(pv.length,'페이지 방문')+kpi(Object.keys(sess).length,'순 방문자(세션)')+
        kpi(ev.filter(function(e){return e.type==='book_click';}).length,'책 클릭')+kpi(raTotal,'영상 재생')+kpi(wbTotal,'워크지 열기')+kpi(buyTotal,'구매 클릭')+kpi(avgD+'s','평균 체류')+
      '</div></div>'+
      '<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">📈 날짜별 추이 <span class="hint">최근 14일</span></h3>'+
        '<select class="t" id="kmetric" style="width:auto;margin-left:auto;padding:6px 10px;font-size:.85rem">'+optsHtml+'</select></div>'+
        '<div id="kchart" style="margin-top:12px"></div></div>'+
      '<div class="card"><h3>페이지별 방문 <span class="hint">(전체 메뉴)</span></h3><table><thead><tr><th>페이지</th><th>방문</th></tr></thead><tbody>'+rows(perPage)+'</tbody></table></div>'+
      '<div class="card"><h3>주제별 방문 <span class="hint">(스터디)</span></h3><table><thead><tr><th>주제</th><th>방문</th></tr></thead><tbody>'+rows(perThemeNamed)+'</tbody></table></div>'+
      '<div class="card"><h3>많이 클릭한 책</h3><table><thead><tr><th>책</th><th>클릭</th></tr></thead><tbody>'+rows(clicks)+'</tbody></table></div>'+
      '<div class="card"><h3>많이 본 영상</h3><table><thead><tr><th>책</th><th>재생</th></tr></thead><tbody>'+rows(raClicks)+'</tbody></table></div>'+
      '<div class="card"><h3>많이 연 워크지</h3><table><thead><tr><th>자료</th><th>열기</th></tr></thead><tbody>'+rows(wbClicks)+'</tbody></table></div>'+
      '<div class="card"><h3>많이 누른 구매 링크</h3><table><thead><tr><th>책</th><th>클릭</th></tr></thead><tbody>'+rows(buyClicks)+'</tbody></table></div>'+
      '<div class="card"><h3>최근 이벤트</h3><table><thead><tr><th>시각</th><th>유형</th><th>주제</th><th>비고</th></tr></thead><tbody>'+(recent||'<tr><td colspan=4 class="hint">아직 없음</td></tr>')+'</tbody></table></div>';
    var kmSel=document.getElementById('kmetric');
    if(kmSel)kmSel.addEventListener('change',function(){drawChart(kmSel.value);});
    drawChart('view');
  }
  function kpi(n,l){return '<div class="kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}

  boot();
})();
</script>
</body>
</html>
