<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/naite-library/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/naite-library/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/naite-library/apple-touch-icon.png">
<link rel="manifest" href="/naite-library/record/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="나이테 스터디">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#245648">
<title>나이테 스터디 — 회원 읽기 기록</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#E4E7DD;color:#23291F;font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
:root{--surface:#FCFCF8;--line:#E2E5DA;--soft:#565E4E;--teal:#2F6E58;--tealD:#245648;--coral:#B87343;--sh:0 1px 2px rgba(43,42,38,.06),0 6px 18px rgba(43,42,38,.07)}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
h1,h2{font-family:'Gowun Batang',Georgia,serif;margin:0;line-height:1.2}
.hero{padding:44px 0 20px;text-align:center}
.hero .ml{font-size:.85rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}
.hero .em{font-size:3rem;margin:12px 0;line-height:1}
.hero h1{font-size:clamp(1.9rem,5vw,2.7rem)}
.hero .en{color:var(--soft);font-weight:700;margin-top:4px}
.hero .subj{max-width:60ch;margin:16px auto 0;white-space:pre-wrap}
.sec{margin-top:26px}.sec h2{font-size:1.3rem;color:var(--tealD);border-bottom:2px solid var(--line);padding-bottom:7px;margin-bottom:14px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}
.book:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(43,42,38,.14)}
.book .cv{position:relative;aspect-ratio:3/4;background:#EBEDE3}.book .cv img{width:100%;height:100%;object-fit:cover;display:block}
.book .cv a.cvlink{display:block;width:100%;height:100%}
.book .pop{position:absolute;top:6px;right:6px;background:rgba(43,42,38,.82);color:#fff;font-size:.62rem;font-weight:800;padding:2px 6px;border-radius:6px}
.book .bb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.book .stats{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.book .st{font-size:.64rem;font-weight:800;padding:2px 6px;border-radius:6px}
.book .st.g{background:#e7f1f0;color:#245648}.book .st.l{background:#fbeee0;color:#8a5a1a}
.book .st.a{background:#f3e9c9;color:#7a5a00}.book .st.k{background:#fbe0de;color:#a2231d}
.book .st.fmt{background:#efe7f5;color:#6a4a8a}.book .st.ar{background:#e7f1f0;color:#245648}
.book .ty{font-size:.66rem;font-weight:800;color:#fff;background:var(--teal);padding:2px 7px;border-radius:6px}
.book .tyrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;align-self:flex-start}
.book .lv{font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
.book .lv.l1{background:#e3f1df;color:#2f6e58}
.book .lv.l2{background:#d8ecee;color:#1f6f72}
.book .lv.l3{background:#fbe3d6;color:#b05a2a}
.lvguide{background:#eef3ea;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:11px;padding:12px 14px;font-size:.86rem;line-height:1.55;color:#2c332a;margin:0 0 12px}
.lvguide .lvkey{display:block;margin-top:8px;font-size:.76rem;color:var(--soft)}
.book .bt{font-family:'Gowun Batang',Georgia,serif;font-weight:700;font-size:.96rem;line-height:1.2;margin-top:4px}
.book .ba{font-size:.76rem;color:var(--soft)}.book .br{font-size:.8rem;color:var(--soft);margin-top:4px}
.prose{white-space:pre-wrap}ul.li{margin:0;padding-left:20px}ul.li li{margin:5px 0}
.expr{list-style:none;padding:0;margin:0}.expr li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;box-shadow:var(--sh)}
.expr .en2{font-weight:700}.expr .ko2{color:var(--soft);font-size:.9rem}
.book .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.book .act{flex:1 1 45%;min-width:62px;text-align:center;font-size:.72rem;font-weight:800;padding:7px 4px;border-radius:8px;text-decoration:none;border:1px solid var(--line);transition:filter .12s}
.book .act:hover{filter:brightness(.96)}
.book .act.wb{background:#eef3ea;color:var(--tealD)}
.book .act.buy{background:var(--coral);color:#fff;border-color:var(--coral)}
.book .act.cp{background:#fff;color:var(--tealD);font-family:inherit;cursor:pointer}
.disc{font-size:.74rem;color:var(--soft);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-top:12px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--sh)}
.vid .fr{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.vid .fr img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .15s}
.vid .fr:hover img{filter:brightness(.82)}
.vid .fr iframe{width:100%;height:100%;border:0;display:block}
.vid .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.vid .pl svg{width:60px;height:60px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
.vid .vt{padding:9px 12px;font-family:'Gowun Batang',Georgia,serif;font-weight:700;font-size:.9rem;line-height:1.25}
.exlink{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--sh);text-decoration:none;color:var(--tealD);font-weight:700;font-size:.92rem;line-height:1.35}
.exlink:hover{filter:brightness(.98)}.exlink span{word-break:break-all}
.empty{color:var(--soft);font-style:italic}
.notice{max-width:640px;margin:60px auto;background:#fff3cd;border:1px solid #e0c97a;border-radius:12px;padding:18px 20px;color:#6b5900}
.foot{border-top:1px solid var(--line);margin-top:36px;padding:22px 0 44px;color:var(--soft);font-size:.82rem;text-align:center}
.cr{font-size:.75rem;color:var(--soft);margin-top:8px;line-height:1.5}
.gate{max-width:420px;margin:64px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 26px;box-shadow:var(--sh)}
.gate .mark{width:60px;height:60px;margin:0 auto 14px;display:block}
.gate h1{font-size:1.6rem}
.gate p{color:var(--soft);margin:10px 0 16px}
.gate input{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:1rem;padding:11px 13px;border-radius:11px;text-align:center}
.gate button{margin-top:12px;width:100%;border:none;background:var(--tealD);color:#fff;font:inherit;font-weight:800;font-size:1rem;padding:12px;border-radius:11px;cursor:pointer}
.gate .ge{color:#a2231d;font-size:.85rem;font-weight:700;margin-bottom:10px}
.archl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.archi{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--sh);color:inherit;font-size:.9rem;transition:transform .13s,box-shadow .13s}
.archi:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(43,42,38,.13)}
.archi span{margin-left:auto;color:var(--soft);font-size:.76rem}
.mlink{display:inline-block;margin-top:18px;font-weight:800;font-size:.95rem;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--coral),#D1965C);padding:11px 20px;border-radius:999px;box-shadow:var(--sh)}
.mlink:hover{filter:brightness(.97)}
.installbtn{border:none;background:var(--tealD);color:#fff;font:inherit;font-weight:800;font-size:.95rem;padding:11px 20px;border-radius:999px;cursor:pointer;box-shadow:var(--sh)}
.installbtn:hover{filter:brightness(1.06)}
.herobtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:18px}
.herobtns .mlink{margin-top:0}
.mlink.alt{background:var(--surface);color:var(--tealD);border:1px solid var(--line)}
/* ── 회원 읽기 기록(reading-log.js) ── */
[hidden]{display:none!important}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
/* 책 카드 '읽었어요' */
.book .rrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.book .acts+.rrow{margin-top:0;padding-top:8px}
.book .rmeta{flex:1 1 90px;min-width:0;font-size:.7rem;color:var(--soft);line-height:1.35}
.book .rmeta b{color:#23291F}
.book .rbtn{flex:0 0 auto;border:0;background:var(--coral);color:#fff;font:inherit;font-weight:800;font-size:.76rem;padding:8px 12px;border-radius:999px;cursor:pointer;touch-action:manipulation}
.book .rbtn:active{transform:scale(.95)}
/* 하단 메뉴 */
.rtabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px -14px rgba(43,42,38,.5)}
.rtabs.enter{animation:rlUp .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rlUp{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.rtabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.rtab.go{border-left:1px solid var(--line);border-radius:0 12px 12px 0}
.rtab.go+.rtab.go{border-left:0;border-radius:12px}
.v-embed{position:fixed;top:0;left:0;right:0;bottom:64px;z-index:30;background:#E4E7DD}
.v-embed[hidden]{display:none}
.v-embed iframe{width:100%;height:100%;border:0;display:block}
.rtab{border:0;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;white-space:nowrap;font-weight:700;color:var(--soft);padding:6px 0 5px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rtab .ic{position:relative;font-size:1.2rem;line-height:1.15;display:grid;place-items:center;height:24px}
.rtab .ic svg{width:22px;height:22px}
.rtab[aria-selected="true"]{color:var(--tealD);background:#E3EEE8}
/* 앱 설치 띠(브라우저로 쓰는 동안, 아래 탭 바로 위) */
.rl-instbar{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:45;max-width:544px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#245648;color:#fff;border-radius:14px;padding:9px 8px 9px 14px;box-shadow:0 8px 22px rgba(43,42,38,.25);font-size:.84rem}
.rl-instbar .t{flex:1;min-width:0;font-weight:700;line-height:1.3}
.rl-instbar .go{flex:0 0 auto;border:0;background:#fff;color:#245648;font:inherit;font-weight:800;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.rl-instbar .x{flex:0 0 auto;border:0;background:none;color:#fff;font-size:1.2rem;line-height:1;padding:4px 6px;cursor:pointer;opacity:.8}
/* 📢 공지 · 🌱 처음 오셨나요? */
.newsbar{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.newsbar button{flex:1 1 140px;border:1px solid var(--line);background:var(--surface);color:var(--tealD);font:inherit;font-weight:800;font-size:.88rem;padding:10px 12px;border-radius:12px;cursor:pointer;box-shadow:var(--sh);position:relative}
.newsbar .dot{display:inline-block;min-width:18px;margin-left:6px;background:#D2453A;color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px;vertical-align:1px}
.newscard{display:block;width:100%;text-align:left;margin-top:10px;background:#FBF1DC;border:1px solid #E7CF9E;border-radius:12px;padding:11px 14px;font:inherit;color:#5E4318;cursor:pointer}
.newscard b{display:block;font-size:.92rem;color:#23291F}
.newscard small{color:#7A5212;font-size:.76rem}
.pn{position:fixed;inset:0;z-index:80;background:#E4E7DD;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pn-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(228,231,221,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pn-top button{border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:800;font-size:.85rem;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--tealD)}
.pn-top b{font-family:'Gowun Batang',Georgia,serif;font-size:1.1rem}
.pn-body{max-width:720px;margin:0 auto;padding:14px 16px 60px}
.nitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
.nitem.new{border-color:#E7CF9E}
.nitem .nh2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nitem h3{font-size:1.02rem;margin:0}
.nitem .nd{font-size:.74rem;color:var(--soft);white-space:nowrap}
.nitem .nb{white-space:pre-wrap;word-break:break-word;font-size:.9rem;margin-top:8px;line-height:1.6}
.nitem .nb a{color:var(--tealD);word-break:break-all}
.wsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.wsec h3{font-size:1.05rem;color:var(--tealD);margin:0 0 10px}
.wsec ol,.wsec ul{margin:0;padding-left:20px;font-size:.92rem;line-height:1.65}
.wsec li{margin:6px 0}
.wsec .wsub{display:block;color:var(--soft);font-size:.84rem}
.wsec a,.wsec .wbtn{color:var(--tealD);font-weight:800}
.wsec .wbtn{display:inline-block;margin-top:6px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.82rem;padding:6px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
.whero{text-align:center;padding:12px 4px 4px}
.whero h2{font-size:1.4rem}
.whero p{color:var(--soft);font-size:.92rem;margin:8px 0 0}
/* 다음 달 미리보기 */
.np{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-top:6px}
.np .nh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.np .nh h2{margin:0}
.np .nm{font-size:.85rem;color:var(--coral);font-weight:800}
.np .nsub{font-size:.82rem;color:var(--soft);margin:4px 0 10px}
.np-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.np-row::-webkit-scrollbar{display:none}
.np-b{flex:0 0 104px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px}
.np-b .np-l{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit}
.np-b .np-cp{margin-top:auto;border:1px solid var(--line);background:#fff;color:var(--tealD);font:inherit;font-size:.68rem;font-weight:800;border-radius:7px;padding:5px 2px;cursor:pointer}
.np-b .cv{aspect-ratio:3/4;border-radius:9px;overflow:hidden;background:#EBEDE3;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.np-b .cv img{width:100%;height:100%;object-fit:cover;display:block}
.np-b .ty{font-size:.66rem;font-weight:800;color:var(--tealD)}
.np-b .tt{font-size:.74rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np-b .lv{font-size:.64rem;color:var(--soft)}
.np-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.np-btns a,.np-btns button{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:800;font-size:.88rem;border-radius:11px;padding:11px;cursor:pointer}
.np-btns .blog{background:linear-gradient(135deg,#2F6E58,#245648);color:#fff;border:0}
.np-btns .more{background:#fff;border:1px solid var(--line);color:var(--tealD)}
.np-btns .cpall{background:#F3EEE4;border:1px solid #E7DCCB;color:#8A5A2E}
.np-btns .cpall small{display:block;font-weight:600;font-size:.72rem;color:var(--soft);margin-top:2px}
/* 토스트 · 아래 창 */
.rl-toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:70;max-width:440px;margin:0 auto;background:#23291F;color:#F4F5EF;border-radius:14px;padding:10px 10px 10px 15px;display:flex;align-items:center;gap:10px;font-size:.84rem;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(18px);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s}
.rl-toast.on{transform:none;opacity:1;pointer-events:auto}
.rl-toast .tx{flex:1;min-width:0;line-height:1.4}
.rl-toast button{border:0;border-radius:9px;background:#D1965C;color:#1f1a14;font:inherit;font-weight:800;font-size:.78rem;padding:7px 11px;cursor:pointer;flex:0 0 auto}
html.rl-lock,html.rl-lock body{overflow:hidden}
.rl-scrim{position:fixed;inset:0;z-index:80;background:rgba(20,26,18,.5);display:flex;align-items:flex-end;justify-content:center}
.rl-sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:rlUp .3s ease}
.rl-sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.rl-sheet h3{font-family:'Gowun Batang',Georgia,serif;font-size:1.3rem;margin:0}
.rl-sheet .sub{font-size:.86rem;color:var(--soft);margin:6px 0 16px}
.rl-sheet .pin{width:100%;text-align:center;font:inherit;font-size:1.3rem;font-weight:800;letter-spacing:.3em;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:#23291F}
.rl-sheet .pin:focus{border-color:var(--tealD);outline:none}
.rl-sheet .err{color:#a2231d;font-size:.82rem;font-weight:700;text-align:center;min-height:1.3em;margin:6px 0 2px}
.rl-sheet .keep{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.84rem;color:var(--soft)}
.rl-sheet .keep input{width:17px;height:17px;accent-color:var(--tealD)}
.rl-sheet .pri{width:100%;margin-top:14px;border:0;background:var(--tealD);color:#fff;font:inherit;font-weight:800;font-size:1rem;padding:13px;border-radius:12px;cursor:pointer}
.rl-sheet .pri:disabled{opacity:.6}
.rl-sheet .subtle{width:100%;margin-top:8px;border:0;background:none;color:var(--soft);font:inherit;font-weight:700;font-size:.86rem;padding:8px;cursor:pointer}
.rl-sheet a.pri{display:block;text-align:center;text-decoration:none}
.rl-sheet .steps{margin:4px 0 6px;padding-left:22px;font-size:.92rem;line-height:1.8}
.rl-sheet .steps b{color:var(--tealD)}
.rv-install{display:block;width:100%;margin:22px 0 0;border:0;background:var(--tealD);color:#fff;font:inherit;font-weight:800;font-size:.95rem;padding:12px;border-radius:12px;cursor:pointer}
.rl-sheet .joinlink{display:block;text-align:center;margin-top:14px;font-size:.84rem;font-weight:800;color:var(--tealD)}
/* 기록하기 탭 · 읽기 통계 */
.rv{max-width:560px;margin:0 auto;padding:6px 16px 30px}
.rv-hd{text-align:center;padding:26px 0 6px}
.rv-hd .em{font-size:2.2rem;line-height:1}
.rv-hd h2{font-size:1.6rem;margin-top:6px;color:#23291F;border:0;padding:0}
.rv-hd p{margin:4px 0 0;color:var(--soft);font-size:.88rem}
.rv-hd p b{color:var(--coral)}
.rv-h3{font-family:'Gowun Batang',Georgia,serif;font-size:1.15rem;color:var(--tealD);border-bottom:2px solid var(--line);padding-bottom:6px;margin:30px 0 8px}
.rv-empty{color:var(--soft);font-size:.88rem;text-align:center}
.rv-leave{display:block;text-align:center;margin:12px auto 0;border:0;background:none;color:var(--soft);font:inherit;font-size:.8rem;font-weight:700;text-decoration:underline;cursor:pointer}

/* ── 나이테 디자인: 기록하기 탭 ── */
.rk,.st,.rl-sheet,.rl-cam{--clay-soft:#F3E7DA;--clay-ink:#7A4520;--sage:#4F9A72;--paper:#EFF1EA;--surface-2:#F4F6EF;--ink:#23291F;--ink-soft:#545C4B;--muted:#8A917E;--line-2:#D4D9C9;--pine:#245648;--pine-2:#2F6E58;--pine-soft:#E4EEE7;--clay:#B87343;--clay-2:#A8622F;--serif:"Gowun Batang",Georgia,serif;--shadow:0 1px 2px rgba(35,41,31,.05),0 8px 22px rgba(35,41,31,.08)}
.rk-months{margin-bottom:6px}

.rk-today{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:16px 0 10px;box-shadow:var(--shadow)}

.rk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rk-book{position:relative;display:block;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.rk-cover{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;aspect-ratio:3/4;border-radius:13px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow);background:#EBEDE3;transition:transform .12s}

.rk-meta{display:block;margin-top:8px}

.rk-other .rk-cover{background:var(--surface);border-style:dashed;gap:8px;color:var(--pine)}

.rk-other .os{font-size:11px;color:var(--muted)}
.rk-finger{position:absolute;right:-6px;bottom:40px;font-size:26px;pointer-events:none;animation:rkTap 1.4s ease-in-out infinite}
@keyframes rkTap{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rk-stamp{position:absolute;top:50%;left:50%;width:74px;height:74px;pointer-events:none;z-index:2;animation:rkStampIn .45s cubic-bezier(.2,1.4,.4,1) forwards,rkStampOut .35s ease 1.1s forwards}

.rk .rs-otitles>span{color:var(--muted)}
/* ── 나이테 디자인: 카메라·찍은 후 ── */
.rl-cam{position:fixed;inset:0;z-index:200;background:#0d0f0b;color:#fff;display:flex;flex-direction:column;font-family:'Noto Sans KR',sans-serif}
.rl-cam-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.rl-cam-top .lbl{font-size:12.5px;font-weight:700;opacity:.9}
.rl-cam-top .at{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:17px}
.cam-x{background:rgba(255,255,255,.14);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.rl-cam-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;margin:0 10px}
.rl-frame{position:relative;width:100cqw;aspect-ratio:3/4;max-height:100cqh;container-type:inline-size;overflow:hidden;border-radius:18px;background:#000}
.rl-frame video{display:block;width:100%;height:100%;object-fit:cover}
.rl-frame video.mirror{transform:scaleX(-1)}
.ovl{--u:calc(100cqw / 352);position:absolute;inset:0;z-index:2;pointer-events:none;color:#fff}
.ovl-frame{position:absolute;inset:calc(var(--u)*13);border:calc(var(--u)*1.6) solid transparent;border-radius:calc(var(--u)*9)}
.ovl-scrim{position:absolute;inset:0}
.ovl-body{position:absolute}
.ovl-ring{width:calc(var(--u)*26);height:calc(var(--u)*26);display:none}
.ovl-date,.ovl-time{font-family:"Gowun Batang",Georgia,serif;font-weight:700;line-height:1.12}
.ovl-sub{display:flex;align-items:center;gap:calc(var(--u)*8);margin-top:calc(var(--u)*7);font-weight:700;font-size:calc(var(--u)*12.5)}
.ovl-sub .sep{width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;background:#B87343;flex:0 0 auto}
.ovl-ig{margin-top:calc(var(--u)*6);font-weight:700;font-size:calc(var(--u)*11);letter-spacing:.04em;opacity:.85;display:inline-flex;align-items:center;gap:calc(var(--u)*5)}
.ovl-ig svg{width:calc(var(--u)*12);height:calc(var(--u)*12)}
.t-ribbon .ovl-ig,.t-frame .ovl-ig{text-shadow:0 1px 6px rgba(0,0,0,.5)}
.t-ribbon .ovl-scrim{background:linear-gradient(0deg,rgba(14,20,11,.78) 2%,rgba(14,20,11,.28) 30%,transparent 56%)}
.t-ribbon .ovl-body{left:0;right:0;bottom:calc(var(--u)*22);text-align:center;padding:0 calc(var(--u)*22)}
.t-ribbon .ovl-ring,.t-frame .ovl-ring{display:block;margin:0 auto calc(var(--u)*9)}
.t-ribbon .ovl-date,.t-ribbon .ovl-time{font-size:calc(var(--u)*29);text-shadow:0 2px 14px rgba(0,0,0,.5)}
.t-ribbon .ovl-sub,.t-frame .ovl-sub{justify-content:center;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.t-frame .ovl-frame{border-color:rgba(255,248,236,.9)}
.t-frame .ovl-scrim{background:linear-gradient(0deg,rgba(14,20,11,.6) 1%,transparent 32%)}
.t-frame .ovl-body{left:calc(var(--u)*13);right:calc(var(--u)*13);bottom:calc(var(--u)*26);text-align:center}
.t-frame .ovl-ring{margin-bottom:calc(var(--u)*7)}
.t-frame .ovl-date,.t-frame .ovl-time{font-size:calc(var(--u)*25);text-shadow:0 2px 12px rgba(0,0,0,.45)}
.t-film .ovl-scrim{background:radial-gradient(130% 90% at 100% 100%,rgba(0,0,0,.5),transparent 58%)}
.t-film .ovl-body{right:calc(var(--u)*16);bottom:calc(var(--u)*16);text-align:right}
.t-film .ovl-date,.t-film .ovl-time{font-family:ui-monospace,"Roboto Mono",monospace;font-size:calc(var(--u)*21);color:#FFBE7A;text-shadow:0 0 12px rgba(255,150,60,.5)}
.t-film .ovl-sub{justify-content:flex-end;font-family:ui-monospace,monospace;color:#FFD6A8;font-size:calc(var(--u)*11);text-shadow:0 0 8px rgba(255,150,60,.4)}
.t-film .ovl-sub .sep{background:#FFBE7A}
.t-film .ovl-ig{font-family:ui-monospace,monospace;color:#FFD6A8;opacity:.92}
.rl-cam-bottom{flex:0 0 auto;padding:14px 22px calc(20px + env(safe-area-inset-bottom,0px))}
.rl-styles{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.schip{font:inherit;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:7px 13px;cursor:pointer}
.schip[aria-pressed="true"]{background:#fff;color:#20261C;border-color:#fff}
.cam-row{display:flex;align-items:center;justify-content:space-between}
.cam-cancel{background:none;border:none;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:70px;text-align:left}
.rl-cam .shot{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box;cursor:pointer;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.rl-cam .shot:active{transform:scale(.94)}
.rl-cam .flip{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);border:none;color:#fff;cursor:pointer;display:grid;place-items:center}
.rl-after{overflow-y:auto}
.rl-photo{flex:0 1 auto;min-height:0;margin:0 16px;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;justify-content:center;background:#000}
.rl-photo img{display:block;max-width:100%;max-height:56vh;-webkit-touch-callout:default}
.rl-photo .rv-empty{color:#cfd3c6;padding:40px 0}
.rl-saved{display:flex;align-items:center;gap:9px;margin:16px 16px 0;background:#E4EEE7;color:#245648;border:1px solid rgba(36,86,72,.26);border-radius:12px;padding:11px 14px;font-weight:700;font-size:13.5px}
.rl-saved button{margin-left:auto;background:none;border:0;color:#245648;text-decoration:underline;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.rl-after-actions{margin:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.rl-after-actions .row{display:flex;gap:10px}
.rl-after .rk-btn.out{background:#FCFCF8;color:#245648;border-color:#D4D9C9}
.rl-after .rk-btn.fill{background:#B87343;color:#fff}
.retake{background:none;border:none;color:#cfd3c6;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;margin:4px auto 0;display:block;padding:8px}
/* ── 기록 탭: 달력 중심 ── */
.rk-calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 2px}
.rk-calhead h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:0;color:var(--ink)}
.rk-btn.sm{flex:0 0 auto;font-size:14px;padding:10px 14px;border-radius:12px;gap:6px}
.rk-calsum{font-size:13px;color:var(--ink-soft);margin:0 0 12px}

.rk .cal-d[data-rcal]:not(.future){cursor:pointer}
.rk .rk-hint{margin:12px 0 4px}
.cal-d{position:relative}
.cal-finger{position:absolute;right:2px;bottom:2px;font-size:20px;pointer-events:none;animation:rkTap 1.4s ease-in-out infinite}
.rk-rs h3 small{font-size:.8rem;color:var(--soft);font-weight:700}
.rk-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin-top:10px}
.rk-grid3 .rk-cover{border-radius:10px}
.rk-grid3 .rk-tap{padding:12px 0 6px;font-size:12px}
.rk-grid3 .rk-chip{top:6px;left:6px;font-size:10.5px;padding:2px 8px}
.rk-grid3 .rk-meta{margin-top:5px}
.rk-grid3 .rk-meta .bt{font-size:11.5px}
.rk-grid3 .rk-other .ot{font-size:12px}
.rl-sheet .rk-cover{border:1px solid #D4D9C9;box-shadow:0 1px 2px rgba(35,41,31,.05),0 6px 16px rgba(35,41,31,.08)}
.rl-sheet .rk-book.unread .rk-cover{border-style:dashed}
.rl-sheet .rk-book.unread .rk-cover img{filter:grayscale(1);opacity:.5}
.rl-sheet .rk-book.read .rk-tap{background:linear-gradient(0deg,rgba(36,86,72,.82),transparent)}
.rl-sheet .rk-chip{background:#245648}
.rl-sheet .rk-other .rk-cover{background:#FCFCF8;color:#245648}
.rk-oform{margin-top:12px}
.rk-oform .row{display:flex;gap:8px}

.rk-dayacts{display:flex;gap:8px;margin-top:12px}
.rk-dayacts .rk-btn{font-size:14px;padding:12px 10px}
.rl-sheet .rk-btn.fill{background:#B87343;color:#fff}
.rl-sheet .rk-btn.out{background:#FCFCF8;color:#245648;border-color:#D4D9C9}
.rk-btn.wide{display:flex;width:100%;margin-top:8px;font-size:14px;padding:12px}
.rl-ask{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.08);font-size:13.5px;font-weight:700}

.rl-note{margin:0;font-size:12.5px;color:#FFD6A8;text-align:center}
.ovl [data-s2]:empty{display:none}
/* ── 달력(기록·통계 공용) ── */
.ncal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:700;color:var(--muted,#8A917E);padding:0 0 7px}
.ncal-wd .sun{color:#B87343}
.ncal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.nc{position:relative;min-height:56px;border-radius:8px;padding:4px 3px 3px;display:flex;flex-direction:column}

.nc .mc{position:relative;width:calc(50% - 1px);aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:#EBEDE3;box-shadow:0 1px 2px rgba(0,0,0,.22)}

.rk .ncal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px 10px;box-shadow:var(--shadow)}

.st-head{text-align:center;padding:4px 0 2px}

.st-card h2{font-family:var(--serif);font-weight:700;font-size:18px;margin:0 0 13px;color:var(--ink)}
.st-note{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12px;color:var(--muted);margin:13px 0 0}

.st-share{width:100%;margin-top:13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--clay);color:#fff;border:none;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:var(--shadow)}
.st-share:active{background:var(--clay-2)}
.st-soft{font-size:13px;color:var(--ink-soft);margin:0}
.st-top{display:flex;gap:14px}

.st-types .row.max .tl{color:var(--clay-ink)}

.st-flow{display:flex;align-items:flex-end;gap:3px;height:92px;padding-top:18px}

.st-flow i.today{background:var(--clay)}
.st-flow i.zero{background:var(--line-2);opacity:.5}
.st-flowx{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
/* ── 이번 달 자료(나이테 디자인) ── */
.sd{--paper:#EFF1EA;--surface:#FCFCF8;--surface-2:#F4F6EF;--ink:#23291F;--ink-soft:#545C4B;--muted:#8A917E;--line:#E3E6DB;--line-2:#D4D9C9;--pine:#245648;--pine-2:#2F6E58;--pine-soft:#E4EEE7;--sage:#4F9A72;--clay:#B87343;--clay-2:#A8622F;--clay-soft:#F3E7DA;--clay-ink:#7A4520;--serif:"Gowun Batang",Georgia,serif;--shadow:0 1px 2px rgba(35,41,31,.05),0 8px 22px rgba(35,41,31,.08);background:var(--paper);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}

.sd-notice .new{flex:0 0 auto;background:var(--clay-soft);color:var(--clay-ink);font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.sd-notice .new.old{background:var(--surface-2);color:var(--muted)}
.sd-notice .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sd-notice svg{color:var(--muted)}

.sd-hero .theme{position:relative;display:flex;align-items:baseline;gap:10px;margin-top:6px}

.sd .exp-more{width:100%;margin-top:10px;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:12.5px;font-weight:700;color:var(--pine);cursor:pointer}

.sd .nsub{font-size:13px;color:var(--ink-soft)}
.sd .shelf{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:2px 16px 4px}
.sd .shelf::-webkit-scrollbar{display:none}
.sd .nb{flex:0 0 92px;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.sd .nb .cv{display:block}
.sd .nb .cv img{display:block;width:100%;height:auto;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sd .nb .ty{font-size:10.5px;font-weight:700;color:var(--pine);margin-top:7px}
.sd .nb .tt{font-size:12px;font-weight:700;line-height:1.3;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sd .nb .lv{margin-top:3px}
.sd .copyall{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--clay-soft);color:var(--clay-ink);border:1px solid #E6D3C0;border-radius:12px;padding:11px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.sd .copyall+.hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:5px}
.sd .linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:700}
.sd .linkrow small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:1px}
.sd .linkrow svg{color:var(--pine)}

.sd .arow:first-child{border-top:0;padding-top:0}
.sd .arow:last-child{padding-bottom:0}
.sd .arow span{flex:1;font-size:12px;color:var(--muted)}
.sd .arow svg{color:var(--muted)}
.sd-foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.6}
.sd-foot .ig{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--pine);text-decoration:none;margin-bottom:8px}
.sd-foot .adm{display:inline-block;margin-top:8px;color:var(--pine);font-weight:700}

<body>
<div id="app"><div class="wrap"><p class="empty" style="padding:60px 0;text-align:center">불러오는 중…</p></div></div>
<script src="../study/config.js"></script>
<script src="reading-log.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var app=document.getElementById('app');
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function notice(msg){app.innerHTML='<div class="wrap"><div class="notice">'+msg+'</div></div>';}

  if(!window.SUPA_ANON||window.SUPA_ANON.indexOf('PASTE')===0){
    notice('⚙️ 아직 연결 전이에요. <code>docs/study/config.js</code> 에 Supabase <b>anon key</b> 를 넣고, DB(schema.sql·seed.sql)를 실행하면 이 페이지가 채워집니다.');
    return;
  }
  var client=supabase.createClient(window.SUPA_URL, window.SUPA_ANON);

  var IS_ADMIN=false;
  var PREVIEW=(location.hash||'').indexOf('preview')>=0; // 관리자 미리보기 모드(집계·아카이브 없이 폼 데이터 렌더)
  function noTrack(){try{return localStorage.getItem('naite_notrack')==='1';}catch(e){return false;}}
  (function(){try{var _q=new URLSearchParams(location.search);if(_q.has('notrack')){var v=_q.get('notrack')==='0'?'0':'1';localStorage.setItem('naite_notrack',v);alert(v==='0'?'이 기기: 방문 집계를 다시 시작합니다.':'이 기기의 방문은 이제 KPI 집계에서 제외됩니다.');}}catch(e){}})();

  function sid(){var s;try{s=localStorage.getItem('joy_sid');if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('joy_sid',s);}}catch(e){s='anon';}return s;}
  var curKey=null;
  async function logEvent(type,extra){if(PREVIEW||IS_ADMIN||noTrack())return;try{var row={type:type,theme_key:curKey,session_id:sid(),path:location.pathname,meta:extra||null};if(extra&&extra.book_id)row.book_id=extra.book_id;await client.from('events').insert(row);}catch(e){}}

  function parseExpr(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var m=l.split(/\s*[|\-–]\s*/);return {en:m[0]||'',ko:m.slice(1).join(' - ')};});}
  function parseList(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean);}
  function parseExtras(t){return (t||'').split(/\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var i=l.indexOf('|');return i<0?{title:'',url:l.trim()}:{title:l.slice(0,i).trim(),url:l.slice(i+1).trim()};});}
  function ytid(u){if(!u)return '';var m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:'';}
  var PLAYSVG='<svg viewBox="0 0 68 48" aria-hidden="true"><path d="M66.5 7.7a8.5 8.5 0 0 0-6-6C55.3 0 34 0 34 0S12.7 0 7.5 1.7a8.5 8.5 0 0 0-6 6A89 89 0 0 0 0 24a89 89 0 0 0 1.5 16.3 8.5 8.5 0 0 0 6 6C12.7 48 34 48 34 48s21.3 0 26.5-1.7a8.5 8.5 0 0 0 6-6A89 89 0 0 0 68 24a89 89 0 0 0-1.5-16.3z" fill="#f00"/><path d="M27 34l18-10-18-10z" fill="#fff"/></svg>';

  // 난이도 단계: 🌱 조작북·AR<2.0 / 🌿 AR 2~3 / 🌳 AR 3 이상
  var LV_EASY_MAX=2.0, LV_MID_MAX=3.0;
  var LV_LABEL={1:'🌱 글밥 적음',2:'🌿 글밥 보통',3:'🌳 글밥 많음'};
  function level(b){if(b.tier===1)return 1;if(b.ar==null||b.ar==='')return 0;var a=Number(b.ar);return a<LV_EASY_MAX?1:(a<LV_MID_MAX?2:3);}

  function render(theme,books,content){
    curKey=theme.key;
    var c=content||{};
    var TORD={1:1,3:2,2:3,4:4,5:5}; // 유형 표시 순서: 조작북→반복→라임→유머→스토리
    // 글밥 오름차순(적음→보통→많음) → 같은 단계 안에서는 유형 순서 유지, 단계 없음은 맨 뒤
    books=(books||[]).slice().sort(function(a,b){
      var la=level(a)||99, lb=level(b)||99; if(la!==lb)return la-lb;
      return (TORD[a.tier]||9)-(TORD[b.tier]||9);
    });
    var hasBuy=books.some(function(b){return b.buy_url;});
    var bh=books.map(function(b){
      var lv=level(b),yt=ytid(b.read_aloud),meta=[];
      if(b.award)meta.push(esc(b.award));
      if(b.kr_popular)meta.push('국내 인기');
      if(b.pop_rank)meta.push('세계 인기');
      if(b.lib_loans)meta.push('도서관 대출 '+esc(b.lib_loans)+'회');
      if(b.format)meta.push(esc(b.format));
      var cv=b.cover?'<img loading="lazy" src="'+esc(b.cover)+'" alt="'+esc(b.title)+'">':'<span class="fbx">'+esc(b.title)+'</span>';
      return '<article class="sd-book" data-bid="'+b.id+'" data-title="'+esc(b.title)+'">'+
        '<div class="bk-top">'+(b.buy_url?'<a class="sd-cv cvlink" href="'+esc(b.buy_url)+'" target="_blank" rel="noopener sponsored nofollow" data-buy="'+esc(b.title)+'">'+cv+'</a>':'<div class="sd-cv">'+cv+'</div>')+
        '<div class="bk-info"><div class="tags"><span class="type">'+esc(b.tier_label)+'</span>'+(lv?'<span class="lv">'+ic(LV_IC[lv],13)+LV_TXT[lv]+'</span>':'')+'</div>'+
          '<h3>'+esc(b.title)+'</h3><div class="au">'+esc(b.author)+'</div>'+(b.reason?'<p class="desc">'+esc(b.reason)+'</p>':'')+
          (meta.length?'<div class="meta">'+meta.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>':'')+'</div></div>'+
        '<div class="acts">'+(yt?'<button type="button" class="act" data-sdvid aria-pressed="false">'+ic('play',15)+'영상</button>':'')+
          (b.workbook?'<a class="act wb" href="'+esc(b.workbook)+'" target="_blank" rel="noopener" data-wb="'+esc(b.title)+'">'+ic('doc',15)+'워크지</a>':'')+
          '<button type="button" class="act" data-copy="'+esc(b.title)+'" data-cpfrom="study">'+ic('copy',15)+'제목 복사</button></div>'+
        (yt?'<div class="sd-vid" hidden><div class="fr" data-yt="'+yt+'" data-title="'+esc(b.title)+'"><img loading="lazy" src="https://img.youtube.com/vi/'+yt+'/mqdefault.jpg" alt="'+esc(b.title)+' 읽어주기 영상" onerror="this.remove()"><span class="play"><span>'+ic('play',22)+'</span></span></div></div>':'')+
        '<div class="rrow bk-foot" data-rrow="'+b.id+'"></div></article>';
    }).join('');
    var acts=parseList(c.activities),exprs=parseExpr(c.expressions),extras=parseExtras(c.extras),how=parseList(c.read_method);
    var exhtml=extras.map(function(x){var id=ytid(x.url);
      if(id)return '<a class="sd-extra" href="'+esc(x.url)+'" target="_blank" rel="noopener" data-title="'+esc(x.title||'부가자료')+'"><span class="th"><img loading="lazy" src="https://img.youtube.com/vi/'+id+'/mqdefault.jpg" alt="" onerror="this.remove()"><span class="play"><span>'+ic('play',14)+'</span></span></span><span><b>'+esc(x.title||'부가 영상')+'</b><small>영상 · YouTube</small></span></a>';
      return '<a class="sd-extra lk" href="'+esc(x.url)+'" target="_blank" rel="noopener" data-title="'+esc(x.title||x.url)+'"><span class="th">'+ic('clip',22)+'</span><span><b>'+esc(x.title||x.url)+'</b><small>링크</small></span></a>';
    }).join('');
    var secs=[['s-books','이번 달 5권']];
    if(how.length)secs.push(['s-how','읽어주기']);
    if(acts.length)secs.push(['s-play','놀이']);
    if(exprs.length)secs.push(['s-exp','영어표현']);
    if(exhtml)secs.push(['s-extra','부가자료']);
    secs.push(['s-next','다음 달']);
    var h='<div id="v-study" class="sd"><div class="sd-wrap">';
    h+='<div class="sd-bar"><span class="brand">'+SD_RING+'나이테</span>'+(PREVIEW?'':'<button type="button" class="ghost" data-pn="welcome">처음 오셨나요?</button>')+'</div>';
    if(!PREVIEW)h+='<div id="newsLatest"></div>';
    h+='<div class="sd-hero"><svg class="deco" viewBox="0 0 460 460" aria-hidden="true">'+decoPaths()+'</svg>'+
       '<div class="eyebrow">'+(c.month_label?esc(c.month_label):'이번 달 영어책')+'</div>'+
       '<div class="theme"><h1>'+esc(theme.ko)+'</h1><span class="en">'+esc(theme.en)+'</span></div>'+
       (c.subject?'<p class="intro" id="sdIntro">'+esc(c.subject)+'</p><button type="button" class="more" id="sdMore">더 보기</button>':'')+
       (theme.blog_url?'<a class="sublink" href="'+esc(theme.blog_url)+'" target="_blank" rel="noopener" data-blog="cur">이 5권을 고른 이유'+ic('right',14)+'</a>':'')+

  function decoPaths(){
    var cx=230,cy=230,R=200,L=9,shape=[0,.12,-.08,.07,-.05,.1,-.1,.05,.08],s='';
    function pt(t,i,seed){var a=-Math.PI/2+i/L*2*Math.PI,jit=6*Math.sin(seed*1.3+i*2.1),r=R*(.86+shape[i%L])*t+jit;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
    for(var k=1;k<16;k++){var t=k/16,p=[];for(var i=0;i<L;i++)p.push(pt(t,i,k));var d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
      for(var q=0;q<L;q++){var a=p[(q-1+L)%L],b=p[q],c=p[(q+1)%L],e=p[(q+2)%L];d+='C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+' '+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+' '+(c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0].toFixed(1)+' '+c[1].toFixed(1);}
      s+='<path d="'+d+'Z" fill="none" stroke="#245648" stroke-width="'+(1.2+t).toFixed(1)+'" opacity="'+(0.08+0.3*t).toFixed(2)+'"/>';}
    return s;
  }

        '<li><b>읽어준 날 인증</b> (채팅방에 사진 or 말)<span class="wsub">이번 달 주제 책이 아니어도 괜찮아요. 빠진 날이 있어도 괜찮아요, 다시 이어가면 돼요</span><span class="wsub">💡 <a href="#shelf" data-pnclose data-rtab="shelf">기록하기 탭</a>에서 인증 카드를 만들어 채팅방에 올려보세요</span></li>'+
        '<li><b>아이와 도서관 가기</b> (선택)<span class="wsub">한 달에 한 번, 아이가 직접 영어책을 골라보는 경험을 해주세요</span></li>'+
      '</ol></div>'+
      '<div class="wsec"><h3>📚 더 알고 싶다면 (선택)</h3><ul>'+
        '<li><a href="'+GUIDE_POST_URL+'" target="_blank" rel="noopener">스터디 자세한 운영 방법 (블로그) ↗</a></li>'+
        '<li><a href="#c120" data-pnclose data-rtab="c120">나이테 120 전체 목록 보기 →</a></li>'+
        '<li><a href="../types.html" target="_blank" rel="noopener">왜 5가지 유형으로 골랐을까요? ↗</a></li>'+
      '</ul></div>'+
      '<div class="wsec"><h3>👋 운영자</h3><p style="margin:0;font-size:.92rem">나이테(드니맘) · 6살 아이와 5년째 엄마표영어 중</p>'+
        '<p style="margin:8px 0 0;font-size:.88rem;color:var(--soft)">인스타 팔로우, 블로그 이웃추가 부탁드려요 🙏<br>이달의 5권이 인스타·블로그에도 올라가서 지난 달 책 다시 찾을 때 편해요</p>'+
        '<a class="wbtn" href="https://www.instagram.com/naite_library/" target="_blank" rel="noopener">📷 인스타그램 팔로우</a> '+
        '<a class="wbtn" href="https://m.blog.naver.com/naite_library" target="_blank" rel="noopener">📝 블로그 이웃추가</a></div>';
  }
  function openPanel(kind){
    var pn=document.getElementById('pn');
    if(!pn){pn=document.createElement('div');pn.id='pn';pn.className='pn';pn.setAttribute('role','dialog');
      pn.innerHTML='<div class="pn-top"><button type="button" data-pnclose>← 닫기</button><b id="pnT"></b></div><div class="pn-body" id="pnB"></div>';document.body.appendChild(pn);}
    document.getElementById('pnT').textContent=kind==='news'?'📢 공지':'🌱 처음 오셨나요?';
    document.getElementById('pnB').innerHTML=kind==='news'?newsHTML():welcomeHTML();
    pn.hidden=false;pn.scrollTop=0;document.body.style.overflow='hidden';
    try{history.replaceState(null,'',location.pathname+location.search+'#'+kind);}catch(e){}
    if(kind==='news'&&NEWS.length){lsSet(NEWS_SEEN_KEY,String(Math.max.apply(null,NEWS.map(function(n){return n.id;}))));paintNewsBar();}
    if(kind==='welcome')lsSet(WELCOME_KEY,'1');
    logEvent(kind==='news'?'news_open':'welcome_open',{});
  }
  function closePanel(){var pn=document.getElementById('pn');if(!pn)return;pn.hidden=true;document.body.style.overflow='';
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  var panelsWired=false;
  function initPanels(){
    if(!panelsWired){panelsWired=true;
      document.addEventListener('click',function(e){var t=e.target.closest('[data-pn]');if(t){e.preventDefault();openPanel(t.getAttribute('data-pn'));return;}
        if(e.target.closest('[data-pnclose]'))closePanel();},true);
      document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});}
    var h=(location.hash||'').slice(1);
    loadNews().then(function(){if(h==='news')openPanel('news');});
    // 처음 들어온 폰(기록도 없고 안내도 안 본 경우)이면 안내를 한 번 자동으로
    var fresh=!lsGet(WELCOME_KEY)&&!lsGet('naite_reads_v2');
    if(h==='welcome'||(fresh&&h!=='news'))openPanel('welcome');
  }

  // 👀 다음 달 미리보기: 커리큘럼 다음 주제의 5권(공개 데이터 c120_data.json) + 그 달 블로그 글(themes.blog_url) + 미리 준비용 쿠팡 링크
  async function fillNext(key,ml){
    var el=document.getElementById('nextPrev');if(!el)return;
    try{
      var tr=await client.from('themes').select('*').order('sort');var th=(tr&&tr.data)||[];
      var i=th.findIndex(function(t){return t.key===key;});if(i<0||i+1>=th.length)return;
      var nx=th[i+1];
      var d=await fetch('../c120_data.json?v='+new Date().toISOString().slice(0,10)).then(function(r){return r.json();});
      var t=(d.themes||[]).filter(function(x){return x.key===nx.key;})[0];if(!t)return;
      var links={};try{var lb=await client.rpc('list_buy_urls');((lb&&lb.data)||[]).forEach(function(r){if(r.buy_url)links[r.title]=r.buy_url;});}catch(e){}
      var m=/(\d{4})\s*년\s*(\d{1,2})\s*월/.exec(ml||''),mon=m?((+m[2])%12+1)+'월':'다음 달';
      var books=t.books.slice().sort(function(a,b){return (level(a)||9)-(level(b)||9)||a.tier-b.tier;});
      var cards=books.map(function(b){var lv=level(b),L=links[b.title];
        var inner='<span class="cv">'+(b.cover?'<img loading="lazy" src="'+esc(b.cover)+'" alt="'+esc(b.title)+'">':'<span class="fbx">'+esc(b.title)+'</span>')+'</span><span class="ty">'+esc(b.tier_label)+'</span><span class="tt">'+esc(b.title)+'</span>'+(lv?'<span class="lv">'+ic(LV_IC[lv],13)+LV_TXT[lv]+'</span>':'');
        return L?'<a class="nb" href="'+esc(L)+'" target="_blank" rel="noopener sponsored nofollow" data-np="'+esc(b.title)+'">'+inner+'</a>':'<div class="nb">'+inner+'</div>';}).join('');
      var all=books.map(function(b,k){return (k+1)+'. '+b.title+(b.author?' ('+b.author+')':'');}).join('\n');
      el.innerHTML='<section id="s-next"><div class="sh">'+ic('eye',20)+'<h2>다음 달 미리보기</h2><span class="cnt clay">'+esc(mon+' · '+t.ko)+'</span></div>'+
        '<div class="card"><div class="nsub">미리 책을 준비해 두세요. 표지를 누르면 책정보가 열려요.</div><div class="shelf">'+cards+'</div>'+
        '<button type="button" class="copyall" data-copy="'+esc(all)+'" data-cpfrom="next_all">'+ic('copy',16)+'5권 제목 한 번에 복사</button><div class="hint">도서관 희망도서 신청 · 장바구니 검색할 때 편해요</div></div>'+
        (nx.blog_url?'<a class="linkrow" href="'+esc(nx.blog_url)+'" target="_blank" rel="noopener" data-npblog="1"><span>이 5권을 고른 이유<small>블로그</small></span>'+ic('right',18)+'</a>':'')+'</section>';
      var nc=document.querySelector('[data-sdt="s-next"]');if(nc)nc.hidden=false;
      el.querySelectorAll('[data-np]').forEach(function(a){a.addEventListener('click',function(){logEvent('buy_click',{title:a.dataset.np,from:'next_preview'});});});
      var bl=el.querySelector('[data-npblog]');if(bl)bl.addEventListener('click',function(){logEvent('blog_click',{theme:nx.key,from:'next_preview'});});
    }catch(e){}
  }

  async function fillArchive(curk){
    try{
      var r=await client.rpc('list_published');
      var list=(r&&r.data)||[];
      var others=list.filter(function(m){return m.key!==curk;});
      var el=document.getElementById('arch'); if(!el)return;
      if(!others.length){el.innerHTML='';return;}
      el.innerHTML='<section class="arch"><div class="sh">'+ic('book',20)+'<h2>지난 달 스터디</h2></div>'+
        '<div class="card">'+others.map(function(m){return '<a class="arow" href="?m='+encodeURIComponent(m.key)+'"><b>'+esc(m.ko)+'</b><span>'+esc(m.month_label||m.en||'')+'</span>'+ic('right',16)+'</a>';}).join('')+'</div></section>';
    }catch(e){}
  }

  // 회원 입장 화면으로(비밀번호 없음·만료). 보던 달(?m=)은 입장 후 돌아오도록 넘겨줌
  function toEntry(expired){
    var q=[];if(expired)q.push('expired=1');var m=curParam();if(m)q.push('m='+encodeURIComponent(m));
    location.replace('./'+(q.length?'?'+q.join('&'):''));
  }

  async function boot(){
    var code=window.NaiteReading?window.NaiteReading.getCode():'';
    if(!code){toEntry(false);return;}
    try{
      try{var g=await client.auth.getSession();var u=g.data.session&&g.data.session.user;IS_ADMIN=!!(u&&window.ADMIN_EMAIL&&u.email&&u.email.toLowerCase()===window.ADMIN_EMAIL.toLowerCase());}catch(e){}
      var key=curParam();
      if(!key){var st=await client.from('settings').select('current_theme').eq('id',1).maybeSingle();key=st.data&&st.data.current_theme;}
      if(!key){notice('아직 공개된 주제가 없어요.');return;}
      // 회원 비밀번호로 자료를 불러옴(페이지별 비밀번호와 무관)
      var r=await client.rpc('get_study_member',{p_key:key,p_code:code});
      if(r.error){notice('불러오지 못했어요.<br><small>'+esc(r.error.message)+'</small>');return;}
      var d=r.data||{};
      if(d.ok){render(d.theme,d.books||[],d.content||{});return;}
      if(d.error==='member'){window.NaiteReading.setCode('');toEntry(true);return;}
      if(d.error==='unpublished'){notice('아직 공개되지 않은 페이지예요.');return;}
      notice('페이지를 찾지 못했어요.');
    }catch(e){notice('데이터를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.<br><small>'+esc(e.message||e)+'</small>');}
  }
  boot();
})();
</script>

/* 홈 화면 앱(record/ 범위). 설치 안내·버튼은 reading-log.js(NaiteReading.install) */
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js',{scope:'/naite-library/record/',updateViaCache:'none'});}catch(e){}}
</script>
