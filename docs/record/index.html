<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/naite-library/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/naite-library/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/naite-library/apple-touch-icon.png">
<link rel="manifest" href="/naite-library/record/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="나이테">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#245648">
<meta name="robots" content="noindex">
<title>나이테 스터디 — 회원 입장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#E4E7DD;color:#23291F;font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
:root{--surface:#FCFCF8;--line:#E2E5DA;--soft:#565E4E;--teal:#2F6E58;--tealD:#245648;--coral:#B87343;--sh:0 1px 2px rgba(43,42,38,.06),0 6px 18px rgba(43,42,38,.07)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.box{width:100%;max-width:400px;text-align:center}
.mark{width:64px;height:64px;display:block;margin:0 auto 14px}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;color:var(--coral)}
h1{font-family:'Gowun Batang',Georgia,serif;font-size:1.9rem;line-height:1.2;margin:6px 0 8px}
.lead{color:var(--soft);margin:0 0 22px;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--sh);text-align:left}
label.l{display:block;font-size:.8rem;font-weight:800;color:var(--soft);margin-bottom:6px}
.pin{width:100%;text-align:center;font:inherit;font-size:1.4rem;font-weight:800;letter-spacing:.3em;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:#23291F}
.pin:focus{border-color:var(--tealD);outline:none}
.err{color:#a2231d;font-size:.84rem;font-weight:700;text-align:center;min-height:1.4em;margin:8px 0 2px}
.info{background:#F6E6D8;color:#6b4220;border-radius:10px;padding:10px 12px;font-size:.84rem;margin-bottom:14px;line-height:1.5}
.keep{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.86rem;color:var(--soft)}
.keep input{width:17px;height:17px;accent-color:var(--tealD)}
.go{width:100%;margin-top:14px;border:0;background:var(--tealD);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;padding:13px;border-radius:12px;cursor:pointer}
.go:disabled{opacity:.6}
.feat{list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.feat li::before{content:'✓ ';color:var(--coral);font-weight:800}
.links{display:flex;flex-direction:column;gap:8px;margin-top:20px;font-size:.88rem}
.links a{color:var(--tealD);font-weight:800;text-decoration:none}
.links .sub{color:var(--soft);font-weight:700}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
[hidden]{display:none!important}
.inapp{background:#FFF3CD;border:1px solid #E0C97A;color:#5c4a00;border-radius:14px;padding:12px 14px;margin:0 0 16px;text-align:left;font-size:.86rem;line-height:1.55}
.inapp b{display:block;font-size:.92rem;margin-bottom:2px}
.inapp a{display:block;text-align:center;margin-top:10px;background:#5c4a00;color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:10px}
.links button.ins{border:0;background:none;font:inherit;color:var(--tealD);font-weight:800;cursor:pointer;padding:0}
/* 아래에서 올라오는 창·토스트(reading-log.js) */
html.rl-lock,html.rl-lock body{overflow:hidden}
.rl-scrim{position:fixed;inset:0;z-index:80;background:rgba(20,26,18,.5);display:flex;align-items:flex-end;justify-content:center}
.rl-sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;text-align:left}
.rl-sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.rl-sheet h3{font-family:'Gowun Batang',Georgia,serif;font-size:1.3rem;margin:0}
.rl-sheet .sub{font-size:.88rem;color:var(--soft);margin:6px 0 12px}
.rl-sheet .steps{margin:4px 0 6px;padding-left:22px;font-size:.92rem;line-height:1.8}
.rl-sheet .steps b{color:var(--tealD)}
.rl-sheet .pri{display:block;width:100%;margin-top:12px;border:0;background:var(--tealD);color:#fff;font:inherit;font-weight:800;font-size:1rem;padding:13px;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none}
.rl-sheet .subtle{width:100%;margin-top:8px;border:0;background:none;color:var(--soft);font:inherit;font-weight:700;font-size:.86rem;padding:8px;cursor:pointer}
.rl-toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;max-width:440px;margin:0 auto;background:#23291F;color:#F4F5EF;border-radius:14px;padding:12px 15px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s}
.rl-toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <div class="box">
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="28" stroke="#245648" stroke-width="3.2"/><circle cx="32" cy="32" r="18" stroke="#245648" stroke-width="3.2" opacity=".7"/><circle cx="32" cy="32" r="9" stroke="#245648" stroke-width="3.2" opacity=".5"/><circle cx="32" cy="32" r="3.2" fill="#D1965C"/></svg>
    <div class="inapp" id="inapp" hidden></div>
    <span class="eyebrow">나이테 엄마표영어 스터디</span>
    <h1>회원 입장</h1>
    <p class="lead">회원 비밀번호를 넣으면 매일 읽은 책을<br>기록하는 화면으로 이동해요.</p>
    <form class="card" id="form" autocomplete="off" novalidate>
      <div class="info" id="info" hidden></div>
      <label class="l" for="pin">회원 비밀번호</label>
      <input class="pin" id="pin" type="password" inputmode="numeric" maxlength="20" placeholder="••••">
      <div class="err" id="err" role="alert"></div>
      <label class="keep"><input type="checkbox" id="keep" checked> 이 폰에서 계속 열어두기</label>
      <button type="submit" class="go" id="go">입장하기</button>
      <ul class="feat">
        <li>표지를 한 번 누르면 읽은 책 기록</li>
        <li>같은 책 반복 읽기까지 쌓이는 우리 책장</li>
        <li>아이가 좋아하는 책 유형 통계</li>
      </ul>
    </form>
    <div class="links">
      <span class="sub">비밀번호는 오픈채팅 공지에 있어요.</span>
      <a href="../study/" id="pubLink">스터디 자료만 둘러보기 ›</a>
      <a href="../join.html?from=member">아직 회원이 아니라면 · 스터디 참여 안내 ›</a>
      <button type="button" class="ins" id="insBtn" data-rinstall="entry">📲 이 화면을 홈 화면에 추가</button>
    </div>
  </div>
</main>
<script src="../study/config.js"></script>
<script src="reading-log.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js',{scope:'/naite-library/record/'});}catch(e){}}
</script>
<script>
(function(){
  var NR=window.NaiteReading,client=supabase.createClient(window.SUPA_URL,window.SUPA_ANON);
  var q=new URLSearchParams(location.search),m=q.get('m')||'';
  var target='app.html'+(m?'?m='+encodeURIComponent(m):'');
  if(m)document.getElementById('pubLink').href='../study/?m='+encodeURIComponent(m);
  var pin=document.getElementById('pin'),err=document.getElementById('err'),go=document.getElementById('go'),info=document.getElementById('info');

  // 카카오톡 등 앱 안 브라우저: 설치가 안 되고 기록도 따로 저장됨 → 크롬/사파리로 열기 안내
  var app=NR.inAppName(),ios=/iphone|ipad|ipod/i.test(navigator.userAgent),ext=NR.externalHref();
  if(app){var ia=document.getElementById('inapp');ia.hidden=false;
    ia.innerHTML='<b>'+app+' 안에서 열려 있어요</b>여기서 기록하면 이 창 안에만 저장되고 홈 화면에 추가할 수도 없어요. '+(ios?'사파리':'크롬')+'에서 열어 주세요. (⋮ / ⋯ 메뉴 → 다른 브라우저로 열기)'+
      (ext?'<a href="'+ext.replace(/"/g,'&quot;')+'">'+(ios?'사파리로':'크롬으로')+' 열기</a>':'');}
  var insBtn=document.getElementById('insBtn');
  if(NR.isStandalone())insBtn.hidden=true;
  insBtn.addEventListener('click',function(){NR.install();});

  // 이미 입장한 폰이면 바로 기록 화면으로(비밀번호가 바뀌었으면 기록 화면이 다시 여기로 보냄)
  if(!q.has('expired')&&NR.getCode()){location.replace(target);return;}
  if(q.has('expired')){info.hidden=false;info.textContent='회원 비밀번호가 바뀌었어요. 새 비밀번호를 넣어주세요. 지금까지의 기록은 그대로 이어져요.';}
  pin.focus();
  pin.addEventListener('input',function(){err.textContent='';});

  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var code=(pin.value||'').trim();
    if(!code){err.textContent='비밀번호를 넣어주세요.';return;}
    go.disabled=true;go.textContent='확인 중…';
    client.rpc('check_member',{p_code:code}).then(function(r){
      go.disabled=false;go.textContent='입장하기';
      if(r.error){err.textContent='확인하지 못했어요. 잠시 뒤 다시 눌러주세요.';return;}
      if(!r.data){err.textContent='비밀번호가 맞지 않아요. 오픈채팅 공지를 확인해 주세요.';pin.select();return;}
      NR.setCode(code,document.getElementById('keep').checked);
      location.replace(target);
    },function(){go.disabled=false;go.textContent='입장하기';err.textContent='연결이 불안정해요. 잠시 뒤 다시 눌러주세요.';});
  });
})();
</script>
</body>
</html>
