<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/naite-library/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/naite-library/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/naite-library/apple-touch-icon.png">
<link rel="manifest" href="/naite-library/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="나이테">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#245648">
<title>엄마표영어 가이드 — 나이테 영어도서관</title>
<meta name="description" content="엄마표영어 기본 개념부터 Q&A까지, 알아두면 좋은 읽을거리.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#E4E7DD;color:#23291F;font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
:root{--surface:#FCFCF8;--line:#E2E5DA;--soft:#565E4E;--tealD:#245648;--coral:#B87343;--amber:#D1965C;--ink:#23291F;--sh:0 1px 2px rgba(43,42,38,.06),0 8px 22px rgba(43,42,38,.08)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
a{color:var(--tealD)}
h1,h2,h3{font-family:'Gowun Batang',Georgia,serif;margin:0;line-height:1.18;text-wrap:balance}
header.top{position:sticky;top:0;z-index:20;background:rgba(228,231,221,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding:11px 20px}
.brand{display:flex;align-items:center;gap:9px;font-family:'Gowun Batang',serif;font-weight:700}
.brand svg{width:28px;height:28px;flex:0 0 auto}
.back{margin-left:auto;font-size:.85rem;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:999px}
.hero{padding:40px 0 10px;text-align:center}
.hero .eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--coral)}
.hero h1{font-size:clamp(1.8rem,5.5vw,2.5rem);margin:.3em 0 .35em}
.hero p{color:var(--soft);max-width:52ch;margin:0 auto;font-size:1.02rem}
.list{display:grid;gap:12px;margin:22px 0 10px}
.g{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--coral);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);text-decoration:none;color:var(--ink)}
.g:hover{filter:brightness(.99);transform:translateY(-1px)}
.g .tx{flex:1;min-width:0}
.g .tt{font-family:'Gowun Batang',Georgia,serif;font-weight:700;font-size:1.08rem;line-height:1.3}
.g .sub{font-size:.8rem;color:var(--soft);margin-top:2px}
.g .arr{color:var(--coral);font-weight:800;flex:0 0 auto}
.empty{color:var(--soft);text-align:center;padding:40px 0;font-style:italic}
.foot{border-top:1px solid var(--line);margin-top:28px;padding:22px 0 50px;color:var(--soft);font-size:.82rem;text-align:center}
@media (max-width:560px){.hero{padding:28px 0 4px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="brand">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="28" stroke="#245648" stroke-width="3.2"/><circle cx="32" cy="32" r="18" stroke="#245648" stroke-width="3.2" opacity=".7"/><circle cx="32" cy="32" r="9" stroke="#245648" stroke-width="3.2" opacity=".5"/><circle cx="32" cy="32" r="3.2" fill="#D1965C"/></svg>
    나이테 영어도서관
  </span>
  <a class="back" href="index.html">← 홈</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">엄마표영어 가이드</div>
    <h1>📚 알아두면 좋은 읽을거리</h1>
    <p>엄마표영어 기본 개념부터 자주 묻는 질문까지. 시작 전에 가볍게 훑어보세요.</p>
  </section>
  <div id="list" class="list"><p class="empty">불러오는 중…</p></div>
</main>

<div class="foot"><div class="wrap">나이테 영어도서관 · 한 권씩, 아이의 영어에 나이테를 만들어요.</div></div>

<script src="study/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var list=document.getElementById('list');
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if(!window.SUPA_ANON||window.SUPA_ANON.indexOf('PASTE')===0){list.innerHTML='<p class="empty">⚙️ 아직 연결 전이에요.</p>';return;}
  var client=supabase.createClient(window.SUPA_URL, window.SUPA_ANON);
  function sid(){var s;try{s=localStorage.getItem('joy_sid');if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('joy_sid',s);}}catch(e){s='anon';}return s;}
  function log(type,extra){try{if(localStorage.getItem('naite_notrack')==='1')return;client.from('events').insert({type:type,session_id:sid(),path:location.pathname,meta:extra||null});}catch(e){}}
  client.from('guides').select('id,title,url').order('sort').order('id').then(function(r){
    var rows=(r&&r.data)||[];
    if(!rows.length){list.innerHTML='<p class="empty">가이드가 곧 추가될 예정이에요.</p>';return;}
    list.innerHTML=rows.map(function(g){return '<a class="g" href="'+esc(g.url)+'" target="_blank" rel="noopener" data-gt="'+esc(g.title)+'"><div class="tx"><div class="tt">'+esc(g.title)+'</div><div class="sub">블로그에서 읽기</div></div><span class="arr">→</span></a>';}).join('');
    list.querySelectorAll('.g').forEach(function(el){el.addEventListener('click',function(){log('guide_click',{title:el.dataset.gt});});});
  }).catch(function(){list.innerHTML='<p class="empty">불러오지 못했어요.</p>';});
})();
</script>
<script src="track.js" data-page="가이드"></script>
<script src="share.js" defer></script>
</body>
</html>
