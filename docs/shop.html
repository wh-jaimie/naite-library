<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/naite-library/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/naite-library/apple-touch-icon.png">
<meta name="theme-color" content="#245648">
<title>나이테 - 영어책육아 메이트</title>
<meta name="description" content="나이테 이번 달 스터디 책 5권과 나이테(드니맘)가 활용한 원서들.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
:root{--ink:#23291F;--soft:#6A6C60;--line:#E7E9E0;--pine:#245648;--red:#E0482E;--bg:#F3F4EF}
body{background:#F7F3EA;color:var(--ink);font-family:'Pretendard',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px}
.band{background:#245648;color:#F7F3EA;font-size:.82rem;padding:9px 16px;text-align:center;line-height:1.45}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.top .brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.top svg{width:30px;height:30px}.top b{font-family:'Gowun Batang',serif;font-size:1.15rem;color:#245648}
.top .go{margin-left:auto;font-size:.82rem;font-weight:700;color:#fff;background:#245648;text-decoration:none;border-radius:999px;padding:8px 14px}
.head{position:relative;text-align:center;padding:14px 18px 6px}
.disc2{margin:14px 18px 0;text-align:center;font-size:.72rem;color:#8A8C80;line-height:1.5}
.head .lg{display:inline-block;width:124px;height:124px;border-radius:50%;background:#fff;padding:0;overflow:hidden;border:1px solid #E7E0D0}
.head .lg img{width:100%;height:100%;border-radius:50%;display:block}
.head h1{margin:16px 0 0;font-size:1.35rem;font-weight:700;color:#245648}
.head .intro a{color:#245648;font-weight:700}
.head .intro{margin:10px 0 0;font-size:.86rem;line-height:1.6;color:#5C6152}
.head .sh{position:absolute;left:18px;top:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(31,61,42,.08)}
.sec{margin:26px 14px 0}
.sec h2{margin:0 0 14px;text-align:center;font-size:1.12rem;font-weight:800;color:#23291F}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.row{display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 3px 12px rgba(60,50,30,.10);transition:transform .12s ease,box-shadow .12s ease;-webkit-tap-highlight-color:transparent}
.row:active{transform:scale(.96);box-shadow:0 1px 5px rgba(60,50,30,.10)}
.im{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;background:#F4F1EA;overflow:hidden;font-size:30px;padding:8px}
.im img{max-width:100%;max-height:100%;display:block;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tx{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 6px 10px;flex:1;justify-content:center}
.nm{font-size:.78rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.mt{display:inline-block;font-size:.62rem;font-weight:700;color:#245648;background:#E7F0EA;border-radius:999px;padding:1px 6px;margin-top:4px}
.pr{font-size:.82rem;font-weight:800;color:#E0482E;margin-top:3px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 14px 0}
.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:13px 8px;border-radius:16px;text-decoration:none;color:#fff;background:#245648;box-shadow:0 4px 12px rgba(36,86,72,.25);transition:transform .12s ease;-webkit-tap-highlight-color:transparent}
.pc:active{transform:scale(.96)}
.pc .pi{font-size:1.4rem}.pc b{font-size:.9rem;font-weight:800;white-space:nowrap;letter-spacing:-.02em}.pc .pa{display:none}
.pc+.pc{background:#D1965C;box-shadow:0 4px 12px rgba(209,150,92,.3)}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);font-size:.85rem;padding:20px}
.foot{text-align:center;font-size:.75rem;color:var(--soft);margin-top:26px;padding:0 18px;line-height:1.6}
.foot a{color:var(--pine);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="./?from=shop"><svg viewBox="0 0 64 64" fill="none" aria-label="나이테"><circle cx="32" cy="32" r="28" stroke="#245648" stroke-width="3.6"/><circle cx="32" cy="32" r="19" stroke="#245648" stroke-width="3.6" opacity=".72"/><circle cx="32" cy="32" r="10" stroke="#245648" stroke-width="3.6" opacity=".5"/><circle cx="32" cy="32" r="3.6" fill="#D1965C"/></svg><b>나이테</b></a>
    <a class="go" href="./?from=shop">나이테 스터디 ›</a></div>
  <div class="head"><button type="button" class="sh" id="shareBtn" aria-label="공유"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1E19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <a class="lg" href="./?from=shop"><img src="naite-profile.jpg" alt="나이테(드니맘)"></a><h1>나이테 - 영어책육아 메이트</h1><p class="intro">한달5권 원서 스터디 운영중입니다.<br>엄마표영어에 필요한 모든 자료를 제공합니다.<br>문의 : <a href="mailto:naite_library@naver.com">naite_library@naver.com</a></p></div>
  <section class="sec"><h2 id="mH">이번 달 스터디 책 5권</h2><div class="grid" id="month"><p class="empty">불러오는 중…</p></div></section>
  <div class="cards"><a class="pc" href="challenge.html?from=shop" data-pc="나이테 120"><span class="pi">🎯</span><b>스터디 전체 과정</b><span class="pa">›</span></a><a class="pc" href="domestic.html?from=shop" data-pc="국내 인기 책장"><span class="pi">🛒</span><b>인기 원서 100</b><span class="pa">›</span></a></div>
  <section class="sec"><h2>나이테가 활용한 원서들</h2><div class="grid" id="road"></div></section>
  <section class="sec"><h2>나이테 대박책</h2><div class="grid" id="best"></div></section>
  <p class="foot"><a href="./?from=shop">나이테 둘러보기 ›</a></p>
  <p class="disc2">이 페이지의 상품 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</div>
<script src="road-data.js"></script>
<script>
(function(){
var U='https://vvfqrewseibjdwcuscaz.supabase.co',K='sb_publishable_3fPCK8UtW4E8iyxfiCit6w_YJlqBxRi',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(t){return String(t||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,'');}
function img(c){if(!c)return '';var u=c.indexOf('road/')===0||c.indexOf('http')===0?c:'https://covers.openlibrary.org/b/'+c+'-M.jpg';return '<img loading="lazy" src="'+esc(u)+'" alt="" onerror="this.replaceWith(\'📚\')">';}
var LP={};
function mon(w){var m=/(\d{4})년 (\d{1,2})월/.exec(w||'');return m?((+m[1]-2021)*12+(+m[2])-1)+'개월':'';}
function won(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function row(it,from){return '<a class="row" href="'+esc(it.url)+'" target="_blank" rel="noopener sponsored nofollow" data-t="'+esc(it.name)+'" data-from="'+from+'"><span class="im">'+(it.img||'📚')+'</span><span class="tx"><span class="nm">'+esc(it.name)+'</span>'+(it.meta?'<span class="mt">'+esc(it.meta)+'</span>':'')+'</span></a>';}
function get(path){return fetch(U+'/rest/v1/'+path,{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];});}
Promise.all([
  get('link_prices?select=url,price'),
  fetch(U+'/rest/v1/rpc/list_buy_urls',{method:'POST',headers:H,body:'{}'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}),
  get('settings?select=current_theme&id=eq.1'),
  fetch('c120_data.json?v='+new Date().toISOString().slice(0,10)).then(function(r){return r.json();}).catch(function(){return {themes:[]};}),
  get('road_links?select=key,buy_url'),
  fetch('shop_images.json?v='+new Date().toISOString().slice(0,10)).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};})
]).then(function(R){
  var PIMG=R[5]||{};
  (R[0]||[]).forEach(function(r){if(r.price>0)LP[r.url]=r.price;});
  var BU={};(R[1]||[]).forEach(function(r){if(r.buy_url)BU[norm(r.title)]=r.buy_url;});
  var cur=R[2]&&R[2][0]&&R[2][0].current_theme,th=(R[3].themes||[]).filter(function(t){return t.key===cur;})[0];
  var m=document.getElementById('month');
  if(th){
    var rows=th.books.filter(function(b){return BU[norm(b.title)];}).map(function(b){return row({name:b.title,meta:b.tier_label,img:img(b.cover),url:BU[norm(b.title)]},'month');});
    m.innerHTML=rows.join('')||'<p class="empty">곧 올라와요</p>';}else m.innerHTML='<p class="empty">곧 올라와요</p>';
  var RL={};(R[4]||[]).forEach(function(r){if(r.buy_url)RL[r.key]=r.buy_url;});
  var road=[],best=[],seen={};
  ROAD.forEach(function(y){y[1].forEach(function(i){var k=roadKey(i.n);if(!/영상|노래|구매/.test(i.k)&&RL[k]&&!seen[k]){seen[k]=1;road.push(row({name:i.n,img:PIMG[i.n]?'<img loading="lazy" src="'+esc(PIMG[i.n])+'" alt="">':(i.photo?'<img loading="lazy" src="'+esc(i.photo)+'" alt="">':img(i.c)),url:RL[k]},'road'));}
    (i.picks||[]).forEach(function(x){var k2=roadKey(x[0]);if(RL[k2]&&!seen[k2]){seen[k2]=1;best.push({name:x[0],img:img(x[1]),url:RL[k2]});}});});});
  BEST.forEach(function(b){var k=roadKey(b[0]);if(RL[k]&&!seen[k]){seen[k]=1;best.push({name:b[0],img:img(b[1]),url:RL[k]});}});
  document.getElementById('road').innerHTML=road.join('');
  // 재밌어요 키(likes.js와 같은 규칙)
  function lkey(t){t=String(t||'').toLowerCase().replace(/&/g,'and').replace(/^\s*the\s+/,'');return t.replace(/[^0-9a-z가-힣]/g,'').slice(0,80);}
  fetch(U+'/rest/v1/rpc/list_likes',{method:'POST',headers:H,body:JSON.stringify({p_keys:best.map(function(b){return lkey(b.name);})})}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}).then(function(rows){
    var N={};(rows||[]).forEach(function(r){N[r.book_key]=r.n;});
    best.forEach(function(b,i){b.n=N[lkey(b.name)]||0;b.i=i;});
    best.sort(function(a,b){return b.n-a.n||a.i-b.i;});
    document.getElementById('best').innerHTML=best.slice(0,10).map(function(b){return row(b,'best');}).join('');});
});
document.getElementById('shareBtn').onclick=function(){var u=location.origin+location.pathname;if(navigator.share)navigator.share({title:'나이테 - 영어책육아 메이트',url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){alert('링크를 복사했어요');});};
document.addEventListener('click',function(e){var c=e.target.closest('a.pc');if(c){try{if(localStorage.getItem('naite_notrack')!=='1')fetch(U+'/rest/v1/events',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({type:'cta_click',session_id:localStorage.getItem('joy_sid')||'anon',path:location.pathname,meta:{page:'인스타 상품',to:c.dataset.pc}}),keepalive:true}).catch(function(){});}catch(x){}return;}var a=e.target.closest('a.row');if(!a)return;try{if(localStorage.getItem('naite_notrack')==='1')return;var sid=localStorage.getItem('joy_sid')||'anon';
  fetch(U+'/rest/v1/events',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({type:'buy_click',session_id:sid,path:location.pathname,meta:{title:a.dataset.t,page:'인스타 상품',from:a.dataset.from}}),keepalive:true}).catch(function(){});}catch(x){}});
})();
</script>
<script src="track.js" data-page="인스타 상품"></script>
</body>
</html>
